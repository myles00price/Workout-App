<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Lift Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2316191D'/%3E%3Crect x='28' y='78' width='124' height='24' rx='4' fill='%23D9A441'/%3E%3Crect x='16' y='62' width='22' height='56' rx='5' fill='%23ECEEF1'/%3E%3Crect x='142' y='62' width='22' height='56' rx='5' fill='%23ECEEF1'/%3E%3C/svg%3E">
<style>html,body{margin:0;padding:0;background:#16191D;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ground: #16191D;
    --surface: #1F242A;
    --surface-2: #272D35;
    --line: #343C46;
    --ink: #ECEEF1;
    --dim: #8E98A5;
    --dimmer: #5C6674;
    --brass: #D9A441;
    --steel: #6E93B8;
    --num: 'Barlow Condensed', 'Oswald', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #app {
    font-family: var(--body);
    background: var(--ground);
    color: var(--ink);
    min-height: 100vh;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 96px;
    font-size: 15px;
    line-height: 1.5;
  }

  .head {
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--line);
  }
  .head .date {
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.01em;
  }
  .head h1 {
    font-family: var(--num);
    font-size: 40px;
    line-height: 1.05;
    font-weight: 600;
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }
  .head .sub {
    font-size: 13.5px;
    color: var(--dim);
    margin-top: 7px;
  }

  .weekstrip {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .wd {
    flex: 1;
    text-align: center;
    padding: 8px 0 9px;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 11px;
    color: var(--dim);
  }
  .wd .n {
    font-family: var(--num);
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    display: block;
    line-height: 1.15;
  }
  .wd.sel { border-color: var(--steel); background: var(--surface-2); }
  .wd.done .n { color: var(--brass); }
  .wd.rest .n { color: var(--dimmer); }

  .list { padding: 4px 12px 0; }

  .ex {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    margin: 8px 0;
    overflow: hidden;
  }
  .ex.open { border-color: var(--steel); }
  .ex.logged { border-left: 3px solid var(--brass); }

  .exhead {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
  }
  .exname {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 500;
  }
  .exmeta {
    font-size: 12px;
    color: var(--dim);
    margin-top: 3px;
    font-weight: 400;
  }
  .target {
    font-family: var(--num);
    font-size: 27px;
    font-weight: 600;
    color: var(--steel);
    white-space: nowrap;
    line-height: 1;
  }
  .target.hit { color: var(--brass); }
  .target small {
    font-family: var(--body);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--dim);
    display: block;
    text-align: right;
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  .exbody {
    padding: 4px 14px 15px;
    border-top: 1px solid var(--line);
  }

  .setrow {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 0;
  }
  .setlabel {
    width: 62px;
    font-size: 11.5px;
    color: var(--dim);
    flex-shrink: 0;
  }
  .setlabel b { color: var(--steel); font-weight: 600; }
  .field { flex: 1; position: relative; }
  .field input {
    width: 100%;
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--ink);
    font-family: var(--num);
    font-size: 22px;
    font-weight: 600;
    padding: 9px 40px 9px 11px;
    text-align: left;
  }
  .field input:focus { outline: 2px solid var(--steel); outline-offset: -1px; border-color: transparent; }
  .field span {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--dimmer);
    pointer-events: none;
  }

  .lastwk {
    font-size: 12px;
    color: var(--dim);
    padding: 8px 0 4px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 4px;
  }
  .lastwk b { color: var(--ink); font-weight: 500; }

  .note {
    font-size: 12px;
    color: var(--brass);
    background: rgba(217,164,65,0.07);
    border-radius: 5px;
    padding: 8px 10px;
    margin: 10px 0 0;
    line-height: 1.45;
  }

  .savebar {
    position: fixed;
    bottom: 52px;
    left: 0; right: 0;
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 12px;
    background: linear-gradient(to top, var(--ground) 62%, transparent);
  }
  .save {
    width: 100%;
    background: var(--brass);
    color: #16191D;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-family: var(--body);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .save:disabled { background: var(--surface-2); color: var(--dimmer); }

  .tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .tab {
    flex: 1;
    padding: 15px 4px 17px;
    text-align: center;
    font-size: 12.5px;
    color: var(--dim);
    cursor: pointer;
    border: none;
    background: none;
    font-family: var(--body);
  }
  .tab.on { color: var(--ink); box-shadow: inset 0 2px 0 var(--brass); }

  .pad { padding: 18px; }
  .pad h2 {
    font-family: var(--num);
    font-size: 25px;
    font-weight: 600;
    margin: 0 0 3px;
  }
  .pad p.lede { color: var(--dim); font-size: 13.5px; margin: 0 0 20px; }

  select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--body);
    font-size: 14.5px;
    margin-bottom: 18px;
  }

  .statrow {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
  }
  .stat .v {
    font-family: var(--num);
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }
  .stat .v.up { color: var(--brass); }
  .stat .k { font-size: 11.5px; color: var(--dim); margin-top: 5px; }

  .hist { border-top: 1px solid var(--line); }
  .hrow {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .hrow .d { color: var(--dim); width: 62px; flex-shrink: 0; font-size: 12.5px; }
  .hrow .s { font-family: var(--num); font-size: 21px; font-weight: 600; }
  .hrow .rest { color: var(--dim); font-size: 12.5px; margin-left: auto; }
  .hrow .pr { color: var(--brass); font-size: 11.5px; }

  .empty {
    color: var(--dim);
    font-size: 13.5px;
    padding: 28px 0;
    text-align: center;
    line-height: 1.6;
  }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .dow { font-size: 10.5px; color: var(--dimmer); text-align: center; padding-bottom: 3px; }
  .cell {
    aspect-ratio: 1;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--num);
    font-size: 15px;
    font-weight: 500;
    color: var(--dimmer);
  }
  .cell.has { background: var(--surface-2); color: var(--ink); border-color: var(--brass); }
  .cell.today { outline: 2px solid var(--steel); outline-offset: -2px; }
  .cell .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--brass); margin-top: 3px; }
  .cell.blank { background: none; }

  .monthnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .monthnav button {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 5px; width: 36px; height: 34px; font-size: 17px; cursor: pointer;
  }
  .monthnav .m { font-family: var(--num); font-size: 21px; font-weight: 600; }

  svg.spark { width: 100%; height: 118px; display: block; margin-bottom: 6px; }

  .backup {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .backup .bk { font-size: 12.5px; color: var(--dim); margin-bottom: 11px; line-height: 1.5; }
  .bkrow { display: flex; gap: 8px; }
  .bkrow button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 11px;
    font-family: var(--body);
    font-size: 13.5px;
    cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 122px; left: 50%; transform: translateX(-50%);
    background: var(--brass); color: #16191D; padding: 11px 20px; border-radius: 6px;
    font-size: 13.5px; font-weight: 600; z-index: 50; white-space: nowrap;
  }

  @media (prefers-reduced-motion: no-preference) {
    .backup {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .backup .bk { font-size: 12.5px; color: var(--dim); margin-bottom: 11px; line-height: 1.5; }
  .bkrow { display: flex; gap: 8px; }
  .bkrow button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 11px;
    font-family: var(--body);
    font-size: 13.5px;
    cursor: pointer;
  }

  .toast { animation: rise .22s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
  }
</style>

</head>
<body>
<div id="app"></div>

<script>
// ─── Program definition ────────────────────────────────────────────────
// Baselines are your logged top sets from Aug 30 and Sept 4.

const PROGRAM = {
  chestBackA: { name: "Chest + Back", ex: [
    { id:"bench",     n:"Barbell flat bench",         sets:4, w:195,  r:8,  lo:8,  hi:10, inc:5 },
    { id:"cgrow",     n:"Seated close-grip cable row",sets:4, w:100,  r:12, lo:12, hi:15, inc:10 },
    { id:"incdb",     n:"Incline pronated DB press",  sets:3, w:90,   r:6,  lo:6,  hi:8,  inc:5 },
    { id:"latpull",   n:"Overhand lat pulldown",      sets:3, w:100,  r:10, lo:10, hi:12, inc:10 },
    { id:"incfly",    n:"Incline DB chest fly",       sets:3, w:30,   r:10, lo:10, hi:15, inc:5, drop:true },
    { id:"facepull",  n:"Face pull",                  sets:3, w:null, r:15, lo:15, hi:20, inc:5 },
  ]},
  shouldersArmsA: { name: "Shoulders + Arms", ex: [
    { id:"dbpress",   n:"Seated DB shoulder press",   sets:4, w:60,   r:8,  lo:8,  hi:10, inc:5 },
    { id:"lateral",   n:"Standing DB lateral raise",  sets:4, w:22.5, r:10, lo:10, hi:15, inc:2.5 },
    { id:"ohtri",     n:"Seated DB overhead tri ext", sets:3, w:60,   r:8,  lo:8,  hi:10, inc:5 },
    { id:"cablecurl", n:"Straight bar cable curl",    sets:3, w:32.5, r:12, lo:12, hi:15, inc:5,
      note:"Your Sept 4 log shows set 3 at 47.5×10 after 32.5×12. Confirm the pulley before trusting this baseline." },
    { id:"pushdown",  n:"Cable rope pushdown",        sets:3, w:null, r:12, lo:12, hi:15, inc:5 },
    { id:"hammer",    n:"Alternating DB hammer curl", sets:3, w:30,   r:12, lo:10, hi:12, inc:5,
      note:"Hold 30 across all three sets. Last session dropped to 20 by set 3 — that's session fatigue, not the plan." },
    { id:"reardelt",  n:"Seated rear delt fly",       sets:3, w:15,   r:10, lo:10, hi:15, inc:5, drop:true },
  ]},
  legs: { name: "Legs", ex: [
    { id:"legpress",  n:"Leg press",                  sets:4, w:null, r:10, lo:8,  hi:12, inc:10 },
    { id:"hamcurl",   n:"Seated hamstring curl",      sets:4, w:null, r:10, lo:10, hi:12, inc:10 },
    { id:"legext",    n:"Leg extension",              sets:3, w:null, r:12, lo:12, hi:15, inc:10 },
    { id:"hipthrust", n:"Hip thrust machine",         sets:3, w:null, r:10, lo:10, hi:12, inc:10,
      note:"Hold until Samantha sets you up. Posterior pelvic control first, load second. Seated lumbar extension until then." },
    { id:"abduct",    n:"Adductor / abductor",        sets:3, w:null, r:12, lo:12, hi:15, inc:10 },
    { id:"calf",      n:"Calf raise",                 sets:4, w:null, r:12, lo:12, hi:15, inc:10 },
  ]},
  chestBackB: { name: "Chest + Back", ex: [
    { id:"incdbB",    n:"Incline pronated DB press",  sets:4, w:80,   r:10, lo:10, hi:12, inc:5 },
    { id:"bbrow",     n:"Bent over barbell row",      sets:4, w:95,   r:10, lo:10, hi:12, inc:5 },
    { id:"cablefly",  n:"Cable fly, high to low",     sets:3, w:17.5, r:10, lo:10, hi:15, inc:2.5 },
    { id:"pullover",  n:"Cable rope pullover",        sets:3, w:42.5, r:12, lo:12, hi:15, inc:5,
      note:"Hold 42.5 across all three sets." },
    { id:"underlat",  n:"Underhand lat pulldown",     sets:3, w:null, r:12, lo:12, hi:15, inc:10, drop:true },
    { id:"shrug",     n:"Barbell shrug",              sets:3, w:155,  r:10, lo:10, hi:15, inc:10 },
  ]},
  legsB: { name: "Legs", ex: [
    { id:"hamcurlB",  n:"Seated hamstring curl",      sets:4, w:null, r:10, lo:10, hi:12, inc:10 },
    { id:"legpressH", n:"Leg press, feet high",       sets:3, w:null, r:12, lo:12, hi:15, inc:10 },
    { id:"legextB",   n:"Leg extension",              sets:3, w:null, r:15, lo:15, hi:20, inc:10 },
    { id:"hipthrustB",n:"Hip thrust machine",         sets:3, w:null, r:12, lo:12, hi:15, inc:10 },
    { id:"calfB",     n:"Calf raise",                 sets:4, w:null, r:15, lo:15, hi:20, inc:10 },
  ]},
  shouldersArmsB: { name: "Shoulders + Arms", ex: [
    { id:"lateralB",  n:"Standing DB lateral raise",  sets:4, w:22.5, r:15, lo:15, hi:20, inc:2.5 },
    { id:"machpress", n:"Machine shoulder press",     sets:3, w:null, r:10, lo:10, hi:12, inc:10 },
    { id:"hammerB",   n:"Alternating DB hammer curl", sets:3, w:30,   r:10, lo:10, hi:12, inc:5 },
    { id:"pushdownB", n:"Cable rope pushdown",        sets:3, w:null, r:12, lo:12, hi:15, inc:5 },
    { id:"reardeltB", n:"Seated rear delt fly",       sets:3, w:15,   r:15, lo:15, hi:20, inc:5 },
  ]},
  recovery: { name: "Active recovery", rest:true, ex: [] },
  off: { name: "Rest day", rest:true, ex: [] },
};

const CORE = {
  shouldersArmsA: "Dead bug 3×8/side · Pallof press 3×10/side",
  legs: "Captain's chair leg raise 3×10 — posterior pelvic tilt at the top",
  recovery: "45 min walk · Dead bug 3×8/side · Pallof press 3×10/side · hip flexor and thoracic mobility",
  legsB: "Seated crunch 3×12 · Pallof press 3×10/side",
  shouldersArmsB: "Seated crunch 3×12 · Pallof press 3×10/side",
};

// Mon=1 … Sun=0. Saturday alternates by ISO week parity.
function dayKeyFor(d) {
  const wd = d.getDay();
  if (wd === 1) return "chestBackA";
  if (wd === 2) return "shouldersArmsA";
  if (wd === 3) return "legs";
  if (wd === 4) return "recovery";
  if (wd === 5) return "chestBackB";
  if (wd === 6) return isoWeek(d) % 2 === 0 ? "legsB" : "shouldersArmsB";
  return "off";
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}

const KEY = "training-log-v1";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt = n => (n === null || n === undefined || n === "") ? "—" : (Math.round(n*10)/10).toString();

let DB = { sessions: {}, targets: {} };
let view = "today";
let cursor = new Date();
let openEx = null;
let draft = {};
let statPick = "bench";
let calMonth = new Date();
let toastMsg = null;

// ─── Storage ───────────────────────────────────────────────────────────
async function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) DB = JSON.parse(raw);
  } catch (e) { /* first run — nothing saved yet */ }
  if (!DB.sessions) DB.sessions = {};
  if (!DB.targets) DB.targets = {};
}
async function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast("Couldn't save. Storage may be full."); }
}
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `lift-log-${iso(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const next = JSON.parse(fr.result);
      if (!next.sessions) throw new Error("bad file");
      DB = { sessions: next.sessions, targets: next.targets || {} };
      await persist();
      toast("Backup restored");
    } catch (e) { toast("That file isn't a lift log backup."); }
  };
  fr.readAsText(file);
}

// ─── Targets ───────────────────────────────────────────────────────────
function target(ex) {
  const t = DB.targets[ex.id];
  if (t) return t;
  return { w: ex.w, r: ex.r };
}
function advance(ex, done) {
  const t = target(ex);
  if (done.w === null || done.r === null) return;
  if (done.w > t.w || (done.w === t.w && done.r >= ex.hi)) {
    DB.targets[ex.id] = { w: (done.w || t.w) + ex.inc, r: ex.lo };
    return "up";
  }
  if (done.w === t.w && done.r >= t.r) {
    DB.targets[ex.id] = { w: t.w, r: Math.min(t.r + 1, ex.hi) };
    return "up";
  }
  DB.targets[ex.id] = { w: done.w, r: t.r };
  return null;
}
function lastFor(id, beforeDate) {
  const dates = Object.keys(DB.sessions).filter(d => d < beforeDate).sort().reverse();
  for (const d of dates) {
    const s = DB.sessions[d];
    if (s.ex && s.ex[id] && s.ex[id][0] && s.ex[id][0].r) return { date: d, sets: s.ex[id] };
  }
  return null;
}
function historyFor(id) {
  return Object.keys(DB.sessions).sort()
    .map(d => ({ date: d, sets: DB.sessions[d].ex?.[id] }))
    .filter(x => x.sets && x.sets[0] && x.sets[0].r);
}
const e1rm = (w, r) => (w && r) ? w * (1 + r/30) : null;

function toast(m) { toastMsg = m; render(); setTimeout(() => { toastMsg = null; render(); }, 1900); }

// ─── Render ────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  let html = "";
  if (view === "today") html = renderToday();
  if (view === "calendar") html = renderCal();
  if (view === "stats") html = renderStats();

  html += `<nav class="tabs">
    ${["today","calendar","stats"].map(t =>
      `<button class="tab ${view===t?"on":""}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
  </nav>`;
  if (toastMsg) html += `<div class="toast">${toastMsg}</div>`;
  app.innerHTML = html;
  bind();
}

function renderToday() {
  const key = dayKeyFor(cursor);
  const day = PROGRAM[key];
  const ds = iso(cursor);
  const saved = DB.sessions[ds];
  const today = iso(new Date());

  let h = `<header class="head">
    <div class="date">${DOW[cursor.getDay()]}, ${MON[cursor.getMonth()]} ${cursor.getDate()}${ds===today?" · today":""}</div>
    <h1>${day.name}</h1>
    <div class="sub">${day.rest ? (CORE[key] || "No lifting scheduled. Walk, eat, sleep.")
      : `${day.ex.length} exercises${saved ? " · logged" : ""}`}</div>
  </header>`;

  // Week strip
  h += `<div class="weekstrip">`;
  const mon = new Date(cursor);
  mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const k = iso(d), dk = dayKeyFor(d);
    h += `<div class="wd ${k===ds?"sel":""} ${DB.sessions[k]?"done":""} ${PROGRAM[dk].rest?"rest":""}" data-goto="${k}">
      ${DOW[d.getDay()][0]}<span class="n">${d.getDate()}</span></div>`;
  }
  h += `</div>`;

  if (day.rest) {
    h += `<div class="empty">${CORE[key] ? "Today's list:<br>" + CORE[key] : "Nothing scheduled."}</div>`;
    return h;
  }

  h += `<div class="list">`;
  for (const ex of day.ex) {
    const t = target(ex);
    const isOpen = openEx === ex.id;
    const logged = saved?.ex?.[ex.id]?.[0]?.r;
    const d = draft[ex.id] || (saved?.ex?.[ex.id]) || [];
    const hitTarget = logged && d[0] && d[0].r >= t.r && (t.w === null || d[0].w >= t.w);

    h += `<div class="ex ${isOpen?"open":""} ${logged?"logged":""}">
      <div class="exhead" data-open="${ex.id}">
        <div class="exname">${ex.n}
          <div class="exmeta">${ex.sets} sets · range ${ex.lo}–${ex.hi}${ex.drop?" · drop set here":""}</div>
        </div>
        <div class="target ${hitTarget?"hit":""}">${t.w===null?"—":fmt(t.w)} × ${t.r}
          <small>${logged ? (hitTarget?"target met":"logged") : "beat this"}</small>
        </div>
      </div>`;

    if (isOpen) {
      const prev = lastFor(ex.id, ds);
      h += `<div class="exbody">`;
      if (prev) {
        h += `<div class="lastwk">Last time (${MON[parse(prev.date).getMonth()]} ${parse(prev.date).getDate()}): <b>${
          prev.sets.filter(s=>s.r).map(s => `${fmt(s.w)}×${s.r}`).join(" · ")}</b></div>`;
      } else if (t.w === null) {
        h += `<div class="lastwk">No baseline yet. Leave 2 reps in reserve and record what you get.</div>`;
      }
      for (let i = 0; i < ex.sets; i++) {
        const s = d[i] || {};
        h += `<div class="setrow">
          <div class="setlabel">${i===0?"<b>Top set</b>":"Set "+(i+1)}</div>
          <div class="field"><input inputmode="decimal" data-ex="${ex.id}" data-i="${i}" data-f="w"
            value="${s.w ?? ""}" placeholder="${i===0 && t.w!==null ? fmt(t.w) : ""}"><span>lbs</span></div>
          <div class="field"><input inputmode="numeric" data-ex="${ex.id}" data-i="${i}" data-f="r"
            value="${s.r ?? ""}" placeholder="${i===0 ? t.r : ""}"><span>reps</span></div>
        </div>`;
      }
      if (ex.note) h += `<div class="note">${ex.note}</div>`;
      h += `</div>`;
    }
    h += `</div>`;
  }
  if (CORE[key]) h += `<div class="note" style="margin:14px 2px">Core: ${CORE[key]}</div>`;
  h += `</div>`;

  const any = Object.values(draft).some(sets => sets.some(s => s && s.r));
  h += `<div class="savebar"><button class="save" id="save" ${any?"":"disabled"}>
    ${saved ? "Update session" : "Save session"}</button></div>`;
  return h;
}

function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const today = iso(new Date());
  const count = Object.keys(DB.sessions).filter(d => d.startsWith(`${y}-${String(m+1).padStart(2,"0")}`)).length;

  let h = `<div class="pad">
    <div class="monthnav">
      <button data-mo="-1">‹</button>
      <div class="m">${MON[m]} ${y}</div>
      <button data-mo="1">›</button>
    </div>
    <div class="cal">${DOW.map(d=>`<div class="dow">${d[0]}</div>`).join("")}`;
  for (let i = 0; i < first; i++) h += `<div class="cell blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const k = iso(new Date(y, m, d));
    const has = !!DB.sessions[k];
    h += `<div class="cell ${has?"has":""} ${k===today?"today":""}" data-goto="${k}">${d}${has?'<div class="dot"></div>':""}</div>`;
  }
  h += `</div>
    <p class="lede" style="margin-top:18px">${count} session${count===1?"":"s"} logged this month. Tap any day to open it.</p>
  </div>`;
  return h;
}

function renderStats() {
  const all = [];
  for (const k in PROGRAM) for (const ex of PROGRAM[k].ex)
    if (!all.some(a => a.id === ex.id)) all.push(ex);
  const ex = all.find(a => a.id === statPick) || all[0];
  const hist = historyFor(ex.id);

  let h = `<div class="pad">
    <h2>Progress</h2>
    <p class="lede">Top set only. That's the number that has to move.</p>
    <select id="pick">${all.map(a =>
      `<option value="${a.id}" ${a.id===ex.id?"selected":""}>${a.n}</option>`).join("")}</select>`;

  const backup = `<div class="backup">
    <div class="bk">Your log lives on this phone only. Save a backup now and then.</div>
    <div class="bkrow">
      <button id="exp">Save backup file</button>
      <button id="imp">Restore backup</button>
    </div>
    <input type="file" id="impfile" accept="application/json" hidden>
  </div>`;

  if (!hist.length) {
    h += `<div class="empty">Nothing logged for this lift yet.<br>Log a session and the trend shows up here.</div>${backup}</div>`;
    return h;
  }

  const pts = hist.map(x => ({ date: x.date, w: x.sets[0].w, r: x.sets[0].r, e: e1rm(x.sets[0].w, x.sets[0].r) }))
                  .filter(p => p.e);
  const first = pts[0], last = pts[pts.length-1];
  const delta = pts.length > 1 ? last.e - first.e : 0;
  const best = pts.reduce((a,b) => b.e > a.e ? b : a, pts[0]);

  h += `<div class="statrow">
    <div class="stat"><div class="v">${fmt(last.w)}<span style="font-size:17px">×${last.r}</span></div><div class="k">Latest top set</div></div>
    <div class="stat"><div class="v ${delta>0?"up":""}">${delta>0?"+":""}${Math.round(delta)}</div><div class="k">Est. 1RM change, lbs</div></div>
  </div>`;

  if (pts.length > 1) {
    const W = 100, H = 100, lo = Math.min(...pts.map(p=>p.e)), hi = Math.max(...pts.map(p=>p.e));
    const rng = (hi - lo) || 1;
    const xy = pts.map((p,i) => [ (i/(pts.length-1))*W, H - ((p.e-lo)/rng)*(H-14) - 7 ]);
    h += `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Estimated one-rep-max trend">
      <polyline fill="none" stroke="var(--steel)" stroke-width="1.4" vector-effect="non-scaling-stroke"
        points="${xy.map(p=>p.join(",")).join(" ")}"/>
      ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.6" vector-effect="non-scaling-stroke"
        fill="${pts[i].e===best.e?"var(--brass)":"var(--steel)"}"/>`).join("")}
    </svg>`;
  }

  h += `<div class="hist">` + hist.slice().reverse().map(x => {
    const d = parse(x.date), top = x.sets[0];
    const isPR = e1rm(top.w, top.r) === best.e;
    const rest = x.sets.slice(1).filter(s=>s.r).map(s=>`${fmt(s.w)}×${s.r}`).join(" · ");
    return `<div class="hrow">
      <div class="d">${MON[d.getMonth()]} ${d.getDate()}</div>
      <div class="s">${fmt(top.w)} × ${top.r}</div>
      ${isPR?'<div class="pr">best</div>':""}
      <div class="rest">${rest||""}</div>
    </div>`;
  }).join("") + `</div>${backup}</div>`;
  return h;
}

// ─── Events ────────────────────────────────────────────────────────────
function bind() {
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.onclick = () => { view = b.dataset.tab; render(); });

  document.querySelectorAll("[data-goto]").forEach(b =>
    b.onclick = () => { cursor = parse(b.dataset.goto); view = "today"; openEx = null; draft = {}; render(); });

  document.querySelectorAll("[data-open]").forEach(b =>
    b.onclick = () => {
      const id = b.dataset.open;
      if (openEx !== id) {
        const saved = DB.sessions[iso(cursor)]?.ex?.[id];
        if (saved && !draft[id]) draft[id] = saved.map(s => ({...s}));
      }
      openEx = openEx === id ? null : id;
      render();
    });

  document.querySelectorAll("[data-mo]").forEach(b =>
    b.onclick = () => { calMonth.setMonth(calMonth.getMonth() + Number(b.dataset.mo)); render(); });

  const pick = document.getElementById("pick");
  if (pick) pick.onchange = () => { statPick = pick.value; render(); };

  const exp = document.getElementById("exp");
  if (exp) exp.onclick = exportData;
  const imp = document.getElementById("imp"), impf = document.getElementById("impfile");
  if (imp) imp.onclick = () => impf.click();
  if (impf) impf.onchange = () => { if (impf.files[0]) importData(impf.files[0]); };

  document.querySelectorAll("input[data-ex]").forEach(inp => {
    inp.oninput = () => {
      const { ex, i, f } = inp.dataset;
      if (!draft[ex]) draft[ex] = [];
      if (!draft[ex][i]) draft[ex][i] = {};
      const v = inp.value === "" ? null : Number(inp.value);
      draft[ex][i][f] = Number.isNaN(v) ? null : v;
      const btn = document.getElementById("save");
      if (btn) btn.disabled = !Object.values(draft).some(s => s.some(x => x && x.r));
    };
  });

  const save = document.getElementById("save");
  if (save) save.onclick = saveSession;
}

async function saveSession() {
  const ds = iso(cursor), key = dayKeyFor(cursor);
  const day = PROGRAM[key];
  const rec = DB.sessions[ds] || { day: key, ex: {} };
  let ups = 0;

  for (const ex of day.ex) {
    const sets = draft[ex.id];
    if (!sets || !sets.some(s => s && s.r)) continue;
    const clean = [];
    for (let i = 0; i < ex.sets; i++) {
      const s = sets[i] || {};
      clean.push({ w: s.w ?? null, r: s.r ?? null });
    }
    rec.ex[ex.id] = clean;
    if (clean[0] && clean[0].r) {
      if (advance(ex, clean[0]) === "up") ups++;
    }
  }
  DB.sessions[ds] = rec;
  await persist();
  draft = {}; openEx = null;
  toast(ups ? `Saved · ${ups} target${ups===1?"":"s"} moved up` : "Saved");
}

// ─── Boot ──────────────────────────────────────────────────────────────
load().then(render);
</script>
</body>
</html>
