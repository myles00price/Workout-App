<style>

  /* ── Splash ─────────────────────────────────────────────────────── */
  #splash { position:fixed; inset:0; z-index:100; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; transition:opacity .45s ease; }
  #splash.out { opacity:0; pointer-events:none; }
  #splash .spin { width:120px; height:120px; position:relative; transform-style:preserve-3d; animation:spin3d 1.8s cubic-bezier(.45,.05,.55,.95) infinite; perspective:600px; }
  #splash .face { position:absolute; inset:0; background-image:var(--logo); background-size:contain; background-position:center; background-repeat:no-repeat; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  #splash .face.front { transform:translateZ(6px); filter:drop-shadow(0 0 18px rgba(232,185,35,.35)); }
  #splash .face.back  { transform:rotateY(180deg) translateZ(6px); filter:brightness(.55); }
  #splash .edge { position:absolute; top:6%; bottom:6%; width:12px; left:calc(50% - 6px); background:linear-gradient(#a37a12,#5f4608); transform:rotateY(90deg); opacity:.9; }
  #splash .edge.e2 { transform:rotateY(-90deg); }
  #splash .splashmark { height:52px; width:auto; }
  @keyframes spin3d { from { transform:rotateY(0deg); } to { transform:rotateY(360deg); } }

  /* ── Themes ─────────────────────────────────────────────────────── */
  html[data-theme="venice"] {
    --ground:#000000; --surface:#111111; --surface-2:#1A1A1A; --line:#262626;
    --ink:#F7F7F7; --dim:#9C9C9C; --dimmer:#5A5A5A;
    --accent:#E8B923; --accent-ink:#000000; --accent-2:#E03131;
    --ok:#E8B923; --warn:#F7F7F7; --bad:#E03131;
    --shadow:none;
  }
  html[data-theme="iron"] {
    --ground:#16191D; --surface:#1F242A; --surface-2:#272D35; --line:#343C46;
    --ink:#ECEEF1; --dim:#8E98A5; --dimmer:#5C6674;
    --accent:#D9A441; --accent-ink:#16191D; --accent-2:#6E93B8;
    --ok:#7FB77E; --warn:#D9A441; --bad:#D96A5C;
    --shadow:none;
  }
  html[data-theme="paper"] {
    --ground:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3; --line:#DCE0E6;
    --ink:#15191E; --dim:#5F6B78; --dimmer:#A3ACB8;
    --accent:#B8761A; --accent-ink:#FFFFFF; --accent-2:#2F6FAD;
    --ok:#3F8F4C; --warn:#C48A1C; --bad:#C2453A;
    --shadow:0 1px 2px rgba(20,30,40,.06);
  }
  html[data-theme="midnight"] {
    --ground:#0D1424; --surface:#151F38; --surface-2:#1C2848; --line:#283760;
    --ink:#E6ECF7; --dim:#8B9AB8; --dimmer:#4E5C7E;
    --accent:#4FC3F7; --accent-ink:#0D1424; --accent-2:#F2C94C;
    --ok:#6FCF97; --warn:#F2C94C; --bad:#EB5757;
    --shadow:none;
  }

  :root {
    --num:'Barlow Condensed','Oswald',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--ground); }
  body { font-family:var(--body); color:var(--ink); font-size:15px; line-height:1.5; }

  #app { max-width:560px; margin:0 auto; min-height:100vh; padding:0 0 100px; }

  h1,h2,h3 { font-family:var(--num); font-weight:600; margin:0; letter-spacing:-.01em; }
  h1 { font-size:40px; line-height:1.05; }
  h2 { font-size:25px; line-height:1.1; }
  h3 { font-size:19px; }
  button { font-family:var(--body); cursor:pointer; }
  input,select { font-family:var(--body); color:var(--ink); }
  input:focus,select:focus,button:focus-visible { outline:2px solid var(--accent-2); outline-offset:-1px; }

  .head { padding:22px 18px 16px; border-bottom:1px solid var(--line); }
  .head .date { font-size:13px; color:var(--dim); }
  .head .sub { font-size:13.5px; color:var(--dim); margin-top:7px; }
  .daynum { font-family:var(--num); font-size:14px; font-weight:600; color:var(--accent); letter-spacing:.04em; text-transform:uppercase; margin:6px 0 -2px; }
  .mtags { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .mtags span { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:2px 7px; }
  .focus { display:inline-block; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:1px 5px; margin-right:7px; vertical-align:2px; }
  .picker { position:relative; margin-top:12px; }
  .pickbtn { width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 14px; color:var(--ink); font-size:14.5px; font-weight:500; }
  .pickbtn i { width:8px; height:8px; border-right:2px solid var(--dim); border-bottom:2px solid var(--dim); transform:rotate(45deg) translateY(-2px); transition:transform .15s; }
  .pickbtn.open { border-color:var(--accent); }
  .pickbtn.open i { transform:rotate(-135deg) translateY(-2px); }
  .pickmenu { position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--accent); border-radius:7px; overflow:hidden; z-index:7; box-shadow:0 12px 32px rgba(0,0,0,.45); }
  .pickmenu button { width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); padding:13px 14px; color:var(--ink); }
  .pickmenu button:last-child { border-bottom:none; }
  .pickmenu button.on { background:var(--surface-2); }
  .pickmenu b { display:block; font-size:14.5px; font-weight:600; }
  .pickmenu span { display:block; font-size:12px; color:var(--dim); margin-top:2px; line-height:1.4; }

  .pad { padding:18px; }
  .lede { color:var(--dim); font-size:13.5px; margin:3px 0 18px; }
  .muted { color:var(--dim); font-size:12.5px; }

  select, .txt {
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:12px; font-size:14.5px; margin-bottom:14px; appearance:none; -webkit-appearance:none;
  }
  select { background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%; background-size:5px 5px; background-repeat:no-repeat; }

const APP_NAME = "Hewn";
const KEY = "lift-log-v2";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y,m-1,dd); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt = n => (n===null||n===undefined||n==="") ? "—" : (Math.round(n*10)/10).toString();
const fmtDate = s => { const d=parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7)); return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7); }
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);

let DB = { sessions:{}, targets:{}, weights:[], active:null, block:null, swaps:{}, sessionSwaps:{}, onDemand:{}, settings:{ theme:"venice", program:"arnold", goalWeight:null, name:"", seed:null, onboarded:false } };
let menuOpen=false, pickOpen=false, odOpen=false, odGroup=null, swapOpen=null, swapKeep=false, startSheet=null, blockDone=false, clockTimer=null, demoOpen={}, DEMO_CACHE={}, view="home", sub="map", cursor=new Date(), openEx=null, draft={}, coreDone=false, statPick=null, review=null, selMuscle=null, toastMsg=null;

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) DB = JSON.parse(raw);
    else {
      const old = localStorage.getItem("training-log-v1");   // migrate v1
      if (old) { const o = JSON.parse(old); DB.sessions = o.sessions||{}; DB.targets = o.targets||{}; }
    }
  } catch(e){}
  DB.sessions ||= {}; DB.targets ||= {}; DB.weights ||= []; DB.active ||= null; DB.block ||= null; DB.swaps ||= {}; DB.sessionSwaps ||= {}; DB.onDemand ||= {};
  for (const d in DB.sessions) { const r=DB.sessions[d]; for (const f of ["ex","tank"]) { if (!r[f]) continue; const o={}; for (const k in r[f]) o[MIGRATE[k]||k]=r[f][k]; r[f]=o; } }
  if (!DB.block && Object.keys(DB.sessions).length) {          // migrate: wrap existing sessions in a block
    const first = Object.keys(DB.sessions).sort()[0]; const m = mondayOf(parse(first));
    startBlock(DB.settings?.program || "arnold", m, false);
    for (const d in DB.sessions) { const sess = DB.block.sessions.find(x=>x.date===d); if (sess) DB.block.done[sess.i]=d; }
  }
  DB.settings = Object.assign({ theme:"venice", program:"arnold", goalWeight:null, name:"", seed:null, onboarded:false }, DB.settings||{});
  // existing installs keep their data and see the welcome sheet once to set a name
  if (!DB.settings.themeSet) DB.settings.theme = "venice";   // new default unless the user has picked one
  document.documentElement.dataset.theme = DB.settings.theme;
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast("Couldn't save. Storage may be full."); } }
function toast(m){ toastMsg=m; render(); setTimeout(()=>{ toastMsg=null; const t=document.querySelector(".toast"); if (t) t.remove(); },1900); }

const prog = () => PROGRAMS[DB.block?.program || DB.settings.program] || PROGRAMS.arnold;
function mondayOf(d){ const m=new Date(d); m.setDate(m.getDate()-((m.getDay()+6)%7)); m.setHours(0,0,0,0); return m; }
function startBlock(programKey, startDate, save=true){
  const P=PROGRAMS[programKey], weeks=P.weeks||4, sessions=[]; let i=0;
  for (let d=0; d<weeks*7; d++){ const dt=new Date(startDate); dt.setDate(dt.getDate()+d); const k=P.schedule(dt), day=P.days[k];
    if (day && !day.rest){ const week=Math.floor(d/7)+1; sessions.push({ i:i++, day:k, date:iso(dt), week, deload:!!(P.deload&&week===weeks), optional:!!day.optional }); } }
  const end=new Date(startDate); end.setDate(end.getDate()+weeks*7-1);
  DB.block={ program:programKey, start:iso(startDate), end:iso(end), weeks, sessions, done:{}, makeups:{} };
  DB.settings.program=programKey; DB.active=null;
  if (save) persist();
}
function dayOf(slot){ return slot.od ? Object.assign({ name:slot.od.name, core:null, ex:slot.od.ex, od:true }, {}) : (prog().days[slot.key] || { name:"Rest day", rest:true, ex:[] }); }
function slotFor(ds){
  const odId = DB.onDemand[ds]; if (odId && OD[odId]) return { key:"od:"+odId, od:OD[odId], sess:null };
  const b=DB.block; if (!b) return { key:"off", none:true };
  const P=PROGRAMS[b.program];
  const mk=Object.entries(b.makeups).find(([i,d])=>d===ds);
  if (mk){ const sess=b.sessions[Number(mk[0])]; return { key:sess.day, sess, deload:sess.deload, makeup:true }; }
  const sess=b.sessions.find(x=>x.date===ds);
  if (sess) return { key:sess.day, sess, deload:sess.deload };
  if (ds>=b.start && ds<=b.end){ const k=P.schedule(parse(ds)); return { key:(P.days[k]&&P.days[k].rest)?k:"off", sess:null }; }
  return { key:"off", sess:null, outside:true };
}
function blockInfo(){
  const b=DB.block; if (!b) return null; const today=iso(new Date());
  const req=b.sessions.filter(x=>!x.optional), done=req.filter(x=>b.done[x.i]).length;
  const missed=b.sessions.filter(x=>!x.optional && !b.done[x.i] && !b.makeups[x.i] && x.date<today);
  const pending=b.sessions.filter(x=>!x.optional && !b.done[x.i] && b.makeups[x.i]);
  const dayN=Math.max(0,daysBetween(b.start,today)), week=Math.min(b.weeks, Math.floor(dayN/7)+1);
  return { b, req:req.length, done, missed, pending, week, complete: done>=req.length, past: today>b.end };
}

//  PROGRESSION MODEL
//  tank: 1–10 from the slider (1 = nothing left, 10 = very easy)
//  mapped to reps in reserve, which drives the next target.
// ═══════════════════════════════════════════════════════════════════════
const tankToRIR = t => t<=2 ? 0 : t<=4 ? 1 : t<=6 ? 2 : t<=8 ? 3 : 4;
const tankLabel = t => ({0:"Nothing left — that was the last rep",1:"One more, maybe",2:"Two clean reps left",3:"Three left — solid but easy",4:"Plenty left — this was light"})[tankToRIR(t)];

function target(ex){ const k=ex.tkey||ex.id; if (DB.targets[k]) return DB.targets[k];
  if (ex.swapped) { const h=historyFor(ex.lib); if (h.length) { const t=h[h.length-1].sets[0]; return { w:t.w, r:Math.max(ex.lo, Math.min(t.r, ex.hi)) }; } }
  return { w:ex.w??null, r:ex.r }; }

function nextTarget(ex, t, top, tank){
  if (top.r===null) return { t, moved:false, why:"" };
  const rir = tank ? tankToRIR(tank) : 1;
  const w = top.w ?? t.w;
  if (t.w===null) return { t:{ w, r:top.r>=ex.hi?ex.lo:Math.min(top.r+1,ex.hi) }, moved:true, why:"Baseline set" };
  const hitW = w >= t.w, hitR = top.r >= t.r;
  if (!hitW || !hitR) return { t:{ w, r:t.r }, moved:false, why:"Retry" };
  if (top.r >= ex.hi) {
    const jump = rir>=3 ? ex.inc*2 : ex.inc;
    return { t:{ w:w+jump, r:ex.lo }, moved:true, why: rir>=3 ? `Easy at the top — up ${jump}` : `Up ${jump}` };
  }
  if (rir>=3) return { t:{ w, r:Math.min(t.r+2,ex.hi) }, moved:true, why:"Easy — add two reps" };
  if (rir>=1) return { t:{ w, r:Math.min(t.r+1,ex.hi) }, moved:true, why:"Add a rep" };
  return { t:{ w, r:t.r }, moved:false, why:"Grind — hold here" };
}

// Estimated 1RM. Averages Epley and Brzycki, folds in reps-in-reserve from the
// slider (a set of 8 with 2 left is a 10-rep effort), and discounts sets past
// 12 reps where every formula gets unreliable.
function e1rmAdj(w, r, tank){
  if (!w || !r) return null;
  const rir = tank ? tankToRIR(tank) : 0;
  const R = Math.min(r + rir, 20);
  const epley = w*(1+R/30), brz = R<37 ? w*36/(37-R) : epley;
  let e = (epley+brz)/2;
  if (R>12) e = w*(1+12/30) + (e - w*(1+12/30))*0.5;   // taper past 12
  return e;
}
const e1rm = (w,r) => e1rmAdj(w,r,null);

// Least-squares trend of e1RM over the last 8 weeks, projected 4 weeks out.
function projectLift(lib, asOf){
  const today = asOf || iso(new Date());
  const pts = historyFor(lib).filter(x=>daysBetween(x.date,today)<=56 && x.sets[0].w && x.sets[0].r)
    .map(x=>({ t:-daysBetween(x.date,today), e:e1rmAdj(x.sets[0].w,x.sets[0].r,x.tank) }));
  if (pts.length<2) return { n:pts.length, now: pts.length?pts[pts.length-1].e:null };
  const n=pts.length, mx=pts.reduce((a,p)=>a+p.t,0)/n, my=pts.reduce((a,p)=>a+p.e,0)/n;
  let sxx=0, sxy=0, sst=0; for (const p of pts){ sxx+=(p.t-mx)**2; sxy+=(p.t-mx)*(p.e-my); sst+=(p.e-my)**2; }
  const slope = sxx? sxy/sxx : 0, icpt = my - slope*mx;
  let sse=0; for (const p of pts) sse += (p.e-(icpt+slope*p.t))**2;
  const r2 = sst ? 1 - sse/sst : 0;
  const now = icpt;                                    // fitted value today
  const cap = now*0.025/7;                             // max 2.5%/week
  const sl = Math.max(-cap, Math.min(cap, slope));
  const conf = n>=5 && r2>0.6 ? "high" : n>=3 ? "medium" : "low";
  return { n, now, in4: now + sl*28, perWeek: sl*7, r2, conf, latest: pts[pts.length-1].e };
}

// Bodyweight-ratio standards (approximate, widely used bands)
const STD = {
  bench:    { n:"Bench",     m:[0.5,0.75,1.0,1.5,2.0],   f:[0.25,0.5,0.75,1.0,1.25] },
  bbsquat:  { n:"Squat",     m:[0.75,1.25,1.5,2.25,2.75],f:[0.5,0.75,1.25,1.5,2.0] },
  deadlift: { n:"Deadlift",  m:[1.0,1.5,2.0,2.5,3.0],    f:[0.5,1.0,1.25,1.75,2.25] },
  bbohp:    { n:"Overhead",  m:[0.35,0.55,0.8,1.05,1.35],f:[0.2,0.35,0.5,0.75,1.0] },
  bbrow:    { n:"Row",       m:[0.5,0.75,1.0,1.25,1.5],  f:[0.35,0.5,0.75,1.0,1.25] },
};
const STD_ALIAS = { sumo:"deadlift", smithbench:"bench", frontsquat:"bbsquat" };
const LEVELS = ["Untrained","Novice","Intermediate","Advanced","Elite"];
function strengthLevel(lib, e){
  const key = STD_ALIAS[lib]||lib, st=STD[key], sex=DB.settings.sex, bw=latestWeight();
  if (!st || !sex || !bw || !e) return null;
  const bands = st[sex], ratio = e/bw;
  let i=0; while (i<bands.length && ratio>=bands[i]) i++;
  const lvl = LEVELS[Math.max(0,i-1)], next = i<bands.length ? { name:LEVELS[i], at:bands[i]*bw } : null;
  return { ratio, lvl, next, name:st.n };
}
function latestWeight(){ const ws=DB.weights.filter(x=>x.w).sort((a,b)=>a.date<b.date?-1:1); return ws.length?ws[ws.length-1].w:null; }
function historyFor(id){ return Object.keys(DB.sessions).sort().map(d=>({date:d,sets:DB.sessions[d].ex?.[id],tank:DB.sessions[d].tank?.[id]})).filter(x=>x.sets&&x.sets[0]&&x.sets[0].r); }
function lastFor(id, before){ const h=historyFor(id).filter(x=>x.date<before); return h.length ? h[h.length-1] : null; }
function bestFor(id, before){ let b=null; for (const x of historyFor(id)) { if (before && x.date>=before) continue; const e=e1rm(x.sets[0].w,x.sets[0].r); if (e && (!b||e>b.e)) b={e,date:x.date,w:x.sets[0].w,r:x.sets[0].r}; } return b; }

//  BODY ANALYSIS
// ═══════════════════════════════════════════════════════════════════════
function muscleStats(){
  const today = iso(new Date()), out = {};
  for (const m in MUSCLES) out[m] = { sets7:0, sets28:0, lastDate:null, trend:null, exCount:0 };
  const trendAcc = {};
  for (const d in DB.sessions) {
    const s = DB.sessions[d], age = daysBetween(d, today);
    for (const id in (s.ex||{})) {
      const ex = LIB[id]; if (!ex) continue;
      const n = s.ex[id].filter(x=>x.r).length; if (!n) continue;
      ex.mus.forEach((m,i)=>{ if (!out[m]) return;
        const wgt = i===0 ? 1 : 0.5;
        if (age<=6) out[m].sets7 += n*wgt;
        if (age<=27) out[m].sets28 += n*wgt;
        if (!out[m].lastDate || d>out[m].lastDate) out[m].lastDate = d;
      });
    }
    if (s.core) ["abs","obliques"].forEach(m=>{ if(age<=6) out[m].sets7+=3; if(age<=27) out[m].sets28+=3; if(!out[m].lastDate||d>out[m].lastDate) out[m].lastDate=d; });
  }
  for (const key in LIB) { const ex=LIB[key];
    const h = historyFor(key).filter(x=>daysBetween(x.date,today)<=27);
    if (h.length<2) continue;
    const a=e1rm(h[0].sets[0].w,h[0].sets[0].r), b=e1rm(h[h.length-1].sets[0].w,h[h.length-1].sets[0].r);
    if (!a||!b) continue;
    const pct=(b-a)/a*100, m=ex.mus[0]; if (!out[m]) continue;
    (trendAcc[m] ||= []).push(pct);
  }
  for (const m in trendAcc) out[m].trend = trendAcc[m].reduce((a,b)=>a+b,0)/trendAcc[m].length;
  const dates = Object.keys(DB.sessions).sort();
  const span = dates.length ? daysBetween(dates[0], today) : 0;
  const pri = prog().priority || [];
  for (const m in out) {
    const o = out[m]; o.priority = pri.includes(m);
    const need = o.priority ? 10 : 8;
    if (o.sets28===0) o.level=0, o.label="No data";
    else if ((o.trend!==null&&o.trend>=2) && o.sets7>=need) o.level=3, o.label="Strong";
    else if (o.sets7>=need || (o.trend!==null&&o.trend>0) || span<14) o.level=2, o.label= span<14 ? "Early days" : "Building";
    else o.level=1, o.label="Needs work";
  }
  return out;
}
function recoveryStats(){
  const today=iso(new Date()), st=muscleStats(), out={};
  for (const m in MUSCLES) {
    const win = MUSCLES[m].big ? 3 : 2;
    const last = st[m].lastDate;
    if (!last) { out[m]={level:0,label:"Not trained yet",days:null}; continue; }
    const days = daysBetween(last, today), pct = days/win;
    out[m] = { days, level: pct<0.6?1 : pct<1?2 : 3, label: pct<0.6?"Recovering" : pct<1?"Almost" : "Ready" };
  }
  return out;
}

function sessionSummary(day, ds, deload){
  let sets=0; for (const sx of day.ex) sets += deload ? Math.min(2,sx.sets) : sx.sets;
  const min = Math.round((sets*2.6 + day.ex.length*1.5 + (day.core?8:0)) / 5) * 5;   // ~2.6 min per working set incl. rest
  return { ex:day.ex.length, sets, min };
}
function sessionMuscles(day, ds){
  const seen=[]; for (const sx of day.ex) { const ex=resolveEx(sx, ds); for (const m of ex.mus.slice(0,2)) if (MUSCLES[m] && !seen.includes(m)) seen.push(m); }
  return seen.slice(0,6);
}
function streakInfo(){
  const b=DB.block; if (!b) return { weeks:0, goal:0, thisWeek:0 };
  const P=PROGRAMS[b.program], today=iso(new Date()), mon=mondayOf(new Date());
  const perWeek = b.sessions.filter(x=>x.week===1 && !x.optional).length;
  const doneOn = new Set(Object.values(b.done)); for (const d in DB.sessions) doneOn.add(d);
  const inWeek = (m) => { let c=0; for (let i=0;i<7;i++){ const d=new Date(m); d.setDate(m.getDate()+i); if (doneOn.has(iso(d))) c++; } return c; };
  const thisWeek = inWeek(mon);
  let weeks=0, m=new Date(mon); m.setDate(m.getDate()-7);
  while (inWeek(m) >= perWeek && weeks<520) { weeks++; m.setDate(m.getDate()-7); }
  if (thisWeek >= perWeek) weeks++;
  return { weeks, goal:perWeek, thisWeek };
}

function cardioFor(dayKey){
  if (String(dayKey).startsWith("od:")) return "Optional. 10–15 min incline walk after if you want it; skip anything that competes with tomorrow's session.";
  const day = prog().days[dayKey];
  if (day.optional) return "This day is optional. If you're in, finish with 15–20 min incline walking. If legs are still sore from Thursday, take the walk and skip the lifts.";
  if (dayKey==="recovery") return "30–45 min walk at conversational pace. Nothing that leaves you sore — the point of today is arriving at tomorrow fresher.";
  if (day.rest) return "Steps only. Hit 10k and leave it there. Rest is the stimulus today.";
  return "10–15 min incline walk after the lift, zone 2, heart rate low enough to talk. Sauna after, not before. Skip anything high-intensity on a lifting day — it competes for the same recovery.";
}

// ── Home ───────────────────────────────────────────────────────────────
function renderHome(){
  const now=new Date(), today=iso(now), hr=now.getHours();
  const greet = hr<12 ? "Morning" : hr<17 ? "Afternoon" : "Evening";
  const slot=slotFor(today), P=prog(), day=P.days[slot.key]||{name:"Rest day",rest:true,ex:[]}, saved=DB.sessions[today], bi=blockInfo(), st=streakInfo();
  const active = DB.active && DB.active.date===today;
  let h = `<div class="pad" style="padding-bottom:6px">
    <div class="muted">${DOW[now.getDay()]}, ${MON[now.getMonth()]} ${now.getDate()}</div>
    <h2 style="font-size:32px">${greet}${DB.settings.name?", "+DB.settings.name:""}</h2>
  </div>`;

  // Today
  h += `<div class="pad" style="padding-top:8px">`;
  if (slot.none || slot.outside) {
    h += `<div class="card"><div class="ck">${slot.none?"No program running":"Block finished"}</div><h3>Pick a program to start a block</h3>
      <button class="primary" style="margin-top:12px" data-go="train" data-pick>Choose a program</button></div>`;
  } else if (day.rest) {
    h += `<div class="card"><div class="ck">Today</div><h3>${day.name}</h3>
      ${day.core?`<div class="muted" style="margin-top:6px">${day.core}</div>`:""}
      <div class="note plain" style="margin-top:10px"><b>Cardio:</b> ${cardioFor(slot.key)}</div>
      ${bi&&bi.missed.length?`<button class="ghost" style="width:100%;margin-top:12px" data-go="train">Make up a missed session (${bi.missed.length})</button>`:""}</div>`;
  } else {
    const sm=sessionSummary(day, today, slot.deload), tags=sessionMuscles(day, today);
    h += `<div class="card today ${saved?"logged":""}">
      <div class="ck">${slot.sess?`Week ${slot.sess.week} · Day ${slot.sess.i+1}`:"Today"}${slot.deload?" · Deload":""}${saved?" · Logged":active?" · In progress":""}</div>
      <h3>${day.name}</h3>
      <div class="muted" style="margin-top:4px">${sm.ex} exercises · ${sm.sets} sets · ~${sm.min} min</div>
      <div class="mtags">${tags.map(m=>`<span>${MUSCLES[m].n}</span>`).join("")}</div>
      <div class="exlist">${day.ex.slice(0,4).map(sx=>{ const ex=resolveEx(sx,today); return `<img src="${DEMO_BASE}${ex.demo}/1.jpg" alt="" loading="lazy">`; }).join("")}${day.ex.length>4?`<span class="more">+${day.ex.length-4}</span>`:""}</div>
      <button class="primary" style="margin-top:14px" data-go="train">${saved?"View session":active?"Continue workout":"Open workout"}</button></div>`;
  }
  if (bi) h += `<div class="blockbar" style="margin:14px 2px 0"><div class="bl"><span>${P.name} · Week ${bi.week} of ${bi.b.weeks}</span><span>${bi.done}/${bi.req} done${bi.missed.length?` · <em>${bi.missed.length} to make up</em>`:""}</span></div><div class="bar"><i style="width:${Math.round(bi.done/bi.req*100)}%"></i></div></div>`;
  h += `</div>`;

  // On demand
  h += `<div class="pad" style="padding-top:0"><div class="card link" data-odpick><div class="ck">On demand</div>
    <div class="rrow">Extra session by muscle group</div><div class="muted" style="margin-top:4px">${Object.values(OD).slice(0,6).map(o=>o.name).join(" · ")} and more</div></div></div>`;

  // Stats
  const dates=Object.keys(DB.sessions).sort(); const since = dates.length ? daysBetween(dates[dates.length-1], today) : null;
  h += `<div class="pad" style="padding-top:4px"><div class="statrow">
    <div class="stat" data-go="progress" data-sub="history"><div class="v ${st.weeks?"up":""}">${st.weeks}</div><div class="k">Week streak</div></div>
    <div class="stat" data-go="progress" data-sub="history"><div class="v ${st.goal&&st.thisWeek>=st.goal?"up":""}">${st.thisWeek}<span style="font-size:17px;color:var(--dim)">/${st.goal||"—"}</span></div><div class="k">This week</div></div>
    <div class="stat" data-go="body" data-sub="recovery"><div class="v">${since===null?"—":since}</div><div class="k">Days since lift</div></div></div>`;

  // Projected max
  const libsSeen = {}; for (const d of dates) for (const k in (DB.sessions[d].ex||{})) if (LIB[k]) libsSeen[k]=(libsSeen[k]||0)+1;
  const mainLibs = Object.keys(libsSeen).filter(k=>historyFor(k).length>=2)
    .sort((a,b)=>((STD[STD_ALIAS[b]||b]?1:0)-(STD[STD_ALIAS[a]||a]?1:0)) || (libsSeen[b]-libsSeen[a])).slice(0,3);
  if (mainLibs.length) {
    h += `<div class="card link" data-go="progress" data-sub="lifts"><div class="ck">Projected max</div>`;
    for (const k of mainLibs) { const pj=projectLift(k), lv=strengthLevel(k, pj.now);
      h += `<div class="pjrow"><div class="nm">${LIB[k].n}${lv?`<div class="muted">${lv.lvl} · ${lv.ratio.toFixed(2)}× bodyweight${lv.next?` · ${lv.next.name} at ${Math.round(lv.next.at)}`:""}</div>`:""}</div>
        <div class="pjnum"><b>${Math.round(pj.now)}</b>${pj.in4?`<span class="arrow"> → </span><b class="${pj.in4>pj.now+1?"up":""}">${Math.round(pj.in4)}</b><small>in 4 wks · ${pj.conf}</small>`:`<small>need 2+ sessions</small>`}</div></div>`; }
    h += `<div class="muted" style="margin-top:8px">Estimated from your top sets and the slider — no max attempts needed. ${DB.settings.sex?"":"Set strength standards in Settings to see levels."}</div></div>`;
  }

  // Recovery
  const rec=recoveryStats(), ready=Object.keys(rec).filter(m=>rec[m].level===3), recov=Object.keys(rec).filter(m=>rec[m].level===1);
  h += `<div class="card link" data-go="body" data-sub="recovery"><div class="ck">Recovery</div>
    <div class="rrow"><b class="up">${ready.length}</b> ready${recov.length?` · <b style="color:var(--accent-2)">${recov.length}</b> still recovering`:""}</div>
    ${recov.length?`<div class="muted" style="margin-top:4px">Recovering: ${recov.slice(0,4).map(m=>MUSCLES[m].n).join(", ")}${recov.length>4?"…":""}</div>`:`<div class="muted" style="margin-top:4px">Everything's fresh.</div>`}</div>`;

  // Last session
  if (dates.length) { const d=dates[dates.length-1], sx=DB.sessions[d], dn=sx.day.startsWith("od:") ? OD[sx.day.slice(3)] : P.days[sx.day]; let sets=0,vol=0,prs=0;
    for (const id in (sx.ex||{})) { const top=sx.ex[id][0]; for (const x of sx.ex[id]) if (x.r){ sets++; vol+=(x.w||0)*x.r; } const b=bestFor(id, d); const e=top&&e1rm(top.w,top.r); if (e&&b&&e>b.e) prs++; }
    h += `<div class="card link" data-go="progress" data-sub="history"><div class="ck">Last session · ${fmtDate(d)}</div><h3 style="font-size:17px">${dn?dn.name:sx.day}</h3>
      <div class="muted" style="margin-top:4px">${sets} sets · ${vol>=1000?(vol/1000).toFixed(1)+"k":vol} lbs${sx.dur?" · "+mmss(sx.dur):""}${prs?` · <span style="color:var(--accent)">${prs} new best${prs===1?"":"s"}</span>`:""}</div></div>`; }

  // Check-in
  const ws=DB.weights.filter(x=>x.w).sort((a,b)=>a.date<b.date?-1:1); const lastW=ws[ws.length-1];
  const stale = !lastW || daysBetween(lastW.date, today)>=7;
  h += `<div class="card link" data-go="progress" data-sub="checkin"><div class="ck">Check-in</div>
    ${lastW?`<div class="rrow"><b>${fmt(lastW.w)}</b> lbs · ${fmtDate(lastW.date)}${DB.settings.goalWeight?` · ${fmt(lastW.w-DB.settings.goalWeight)} to goal`:""}</div>`:`<div class="rrow">No weigh-ins yet</div>`}
    ${stale?`<div class="muted" style="margin-top:4px;color:var(--accent)">Time to weigh in — same conditions as last time.</div>`:""}</div>`;
  h += `</div>`;
  return h;
}

// ── Train ──────────────────────────────────────────────────────────────
function renderTrain(){
  const ds=iso(cursor), today=iso(new Date()), slot=slotFor(ds), key=slot.key, day=dayOf(slot), saved=DB.sessions[ds];
  const active = DB.active && DB.active.date===ds ? DB.active : null;
  const bi=blockInfo();

  let h = `<header class="head">
    <div class="date">${DB.settings.name?DB.settings.name+" · ":""}${DOW[cursor.getDay()]}, ${MON[cursor.getMonth()]} ${cursor.getDate()}${ds===today?" · today":""}</div>
    ${slot.sess ? `<div class="daynum">Week ${slot.sess.week} · Day ${slot.sess.i+1}${slot.sess.deload?" · Deload":""}</div>` : slot.od ? `<div class="daynum">On demand · ${OD_GROUPS.find(g=>g[0]===slot.od.g)[1]}</div>` : ""}
    <h1>${slot.none ? "No program running" : slot.outside ? "Outside your block" : day.name}</h1>
    <div class="sub">${slot.none ? "Pick a program below to start a block." : slot.outside ? (ds>DB.block.end ? "Your block has ended. Start the next one below." : "Your block starts "+fmtDate(DB.block.start)+".") : day.rest ? "No lifting scheduled." : (()=>{ const sm=sessionSummary(day, ds, slot.deload); return `${sm.ex} exercises · ${sm.sets} sets · ~${sm.min} min${slot.makeup?" · make-up":""}${day.optional?" · optional":""}${saved?" · logged":""}`; })()}</div>
    ${!day.rest && !slot.none && !slot.outside ? `<div class="mtags">${sessionMuscles(day, ds).map(m=>`<span>${MUSCLES[m].n}</span>`).join("")}</div>` : ""}
    ${bi ? `<div class="blockbar"><div class="bl"><span>${PROGRAMS[bi.b.program].name} · Week ${bi.week} of ${bi.b.weeks}</span><span>${bi.done}/${bi.req} done${bi.missed.length?` · <em>${bi.missed.length} to make up</em>`:""}</span></div><div class="bar"><i style="width:${Math.round(bi.done/bi.req*100)}%"></i></div></div>` : ""}
    ${active ? `<div class="clockrow"><span class="clocklbl">In progress</span><span id="clock" class="clock">${mmss(Date.now()-active.start)}</span><button class="clockx" id="discard" aria-label="Discard timer">×</button></div>` : ""}
    <div class="picker">
      <button class="pickbtn ${pickOpen?"open":""}" id="pickbtn" aria-expanded="${pickOpen}"><span>${prog().name}</span><i></i></button>
      ${pickOpen?`<div class="pickmenu">${Object.keys(PROGRAMS).map(k=>`<button class="${k===DB.block?.program?"on":""}" data-prog="${k}"><b>${PROGRAMS[k].name}</b><span>${PROGRAMS[k].level} · ${PROGRAMS[k].daysPerWeek} days/wk · ${PROGRAMS[k].weeks}-week block</span><span>${PROGRAMS[k].desc}</span></button>`).join("")}</div>`:""}
    </div>
  </header>`;

  h += `<div class="weekstrip"><button class="wk" data-week="-1" aria-label="Previous week">‹</button>`;
  const mon = new Date(cursor); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  for (let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); const k=iso(d), sl=slotFor(k);
    const done = sl.sess && DB.block.done[sl.sess.i]===k, missed = sl.sess && !done && !sl.sess.optional && k<today && !DB.block.makeups[sl.sess.i], sched = !!sl.sess;
    h += `<div class="wd ${k===ds?"sel":""} ${done?"done":""} ${missed?"missed":""} ${sched&&!done&&!missed?"sched":""} ${!sched?"rest":""} ${k===today?"today":""}" data-goto="${k}">${DOW[d.getDay()][0]}<span class="n">${done?"✓":d.getDate()}</span></div>`; }
  h += `<button class="wk" data-week="1" aria-label="Next week">›</button></div>`;
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  h += `<div class="weeklbl">${MON[mon.getMonth()]} ${mon.getDate()} – ${MON[sun.getMonth()]} ${sun.getDate()}${iso(mon)<=today&&today<=iso(sun)?"":' · <span data-goto="'+today+'">back to today</span>'}</div>`;

  if (day.rest || slot.none || slot.outside) {
    h += `<div class="pad">`;
    if (slot.none || slot.outside) h += `<button class="primary" id="openpick" style="margin-bottom:14px">Start a program</button>`;
    if (bi && bi.missed.length && !saved && ds<=today) h += `<h3 style="margin-bottom:6px">Make up a missed session</h3><p class="lede">Do it today and it counts toward the block.</p>` +
      bi.missed.map(x=>`<button class="ghost makeup" data-makeup="${x.i}"><b>${PROGRAMS[bi.b.program].days[x.day].name}</b><span>Week ${x.week} · was ${fmtDate(x.date)}</span></button>`).join("");
    if (day.core) h += `<div class="note plain">${day.core}</div>`;
    if (!slot.none && !slot.outside) h += `<div class="note plain" style="margin-top:10px"><b>Cardio:</b> ${cardioFor(key)}</div>`;
    h += `<button class="ghost" style="width:100%;margin-top:14px" data-odpick>Add an on-demand workout</button>`;
    h += `</div>`; return h;
  }
  if (slot.od && !saved) h += `<div class="pad" style="padding-bottom:0"><div class="note plain">${slot.od.tag}. <span data-unod style="color:var(--accent-2);cursor:pointer">Remove from today</span></div></div>`;
  if (slot.deload) h += `<div class="pad" style="padding-bottom:0"><div class="note"><b>Deload week.</b> Same weights, two working sets per exercise. Targets hold this week. This is where the growth from the last three weeks actually shows up.</div></div>`;
  if (slot.makeup) h += `<div class="pad" style="padding-bottom:0"><div class="note plain">Making up ${day.name} from week ${slot.sess.week}. <span data-unmakeup="${slot.sess.i}" style="color:var(--accent-2);cursor:pointer">Undo</span></div></div>`;

  h += `<div class="list">`;
  for (const slotEx of day.ex) {
    const ex=resolveEx(slotEx, ds), t=target(ex), isOpen=openEx===ex.id;
    const d = draft[ex.id] || saved?.ex?.[ex.lib] || [];
    const logged = d[0]&&d[0].r;
    const hit = logged && d[0].r>=t.r && (t.w===null||d[0].w>=t.w);
    const best = bestFor(ex.lib, ds), curE = logged ? e1rm(d[0].w,d[0].r) : null;
    const isPR = logged && curE && (!best || curE>best.e);
    const tank = (draft.__tank||{})[ex.id] ?? saved?.tank?.[ex.lib] ?? null;

    h += `<div class="ex ${isOpen?"open":""} ${logged?"logged":""} ${isPR&&saved?"pr":""}">
      <div class="exhead" data-open="${ex.id}">
        ${ex.demo?`<img class="thumb" src="${DEMO_BASE}${ex.demo}/1.jpg" alt="" loading="lazy">`:""}
        <div class="exname">${day.ex[0]===slotEx?'<span class="focus">Focus</span>':""}${ex.n}<div class="exmeta">${ex.sets} sets · ${ex.lo}–${ex.hi}${ex.swapped?' · <span style="color:var(--accent-2)">swapped</span>':""}${ex.drop?" · drop set":""}${isPR&&saved?" · <b style='color:var(--accent)'>new best</b>":""}</div></div>
        <div class="target ${hit?"hit":""}">${t.w===null?"—":fmt(t.w)} × ${t.r}<small>${logged?(hit?"target met":"logged"):"beat this"}</small></div>
      </div>`;
    if (isOpen) {
      const prev = lastFor(ex.lib, ds);
      h += `<div class="exbody">`;
      if (swapOpen===ex.id) {
        const alts=alternativesFor(ex);
        h += `<div class="swap"><div class="lbl"><span>Swap ${LIB[slotEx.lib].n}</span><label><input type="checkbox" id="swapkeep" ${swapKeep?"checked":""}> Keep for future sessions</label></div>
          ${ex.swapped?`<button class="alt back" data-swapto="${slotEx.lib}"><b>Back to ${LIB[slotEx.lib].n}</b><span>The program's pick</span></button>`:""}
          ${alts.map(a=>`<button class="alt" data-swapto="${a.lib}"><img src="${DEMO_BASE}${a.demo}/1.jpg" alt="" loading="lazy"><div><b>${a.n}</b><span>${EQ[a.eq]} · ${a.mus.map(m=>MUSCLES[m]?.n||m).join(", ")}</span></div></button>`).join("")}
          <button class="ghost" style="width:100%;margin-top:6px" data-swapclose>Cancel</button></div>`;
      }
      if (prev) h += `<div class="lastwk">Last (${fmtDate(prev.date)}): <b>${prev.sets.filter(s=>s.r).map(s=>`${fmt(s.w)}×${s.r}`).join(" · ")}</b>${best?` · best ${fmt(best.w)}×${best.r}`:""}</div>`;
      else if (t.w===null) h += `<div class="lastwk">No baseline yet. Leave 2 in the tank and record what you get.</div>`;
      for (let i=0;i<(slot.deload?Math.min(2,ex.sets):ex.sets);i++){ const s=d[i]||{};
        h += `<div class="setrow"><div class="setlabel">${i===0?"<b>Top set</b>":"Set "+(i+1)}</div>
          <div class="field"><input inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" enterkeyhint="next" autocomplete="off" data-ex="${ex.id}" data-i="${i}" data-f="w" value="${s.w??""}" placeholder="${i===0&&t.w!==null?fmt(t.w):""}"><span>lbs</span></div>
          <div class="field"><input inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="off" data-ex="${ex.id}" data-i="${i}" data-f="r" value="${s.r??""}" placeholder="${i===0?t.r:""}"><span>reps</span></div></div>`; }
      h += `<div class="tank">
        <div class="lbl"><span>Left in the tank on the top set</span><b>${tank??"—"}</b></div>
        <input type="range" min="1" max="10" step="1" value="${tank??5}" data-tank="${ex.id}">
        <div class="ends"><span>1 · nothing left</span><span>10 · very easy</span></div>
        <div class="read">${tank?tankLabel(tank):"Slide to rate the top set"}</div></div>`;
      if (ex.note && DB.settings.seed==="myles") h += `<div class="note">${ex.note}</div>`;
      if (ex.demo) {
        const open = demoOpen[ex.id], dm = DEMO_CACHE[ex.demo];
        h += `<div class="rowbtns"><button class="howto" data-demo="${ex.id}">${open?"Hide":"How to"} ▸</button><button class="howto" data-swap="${ex.id}">Swap ⇄</button></div>`;
        if (open) h += `<div class="demo"><div class="frames"><img src="${DEMO_BASE}${ex.demo}/0.jpg" alt="Start position" loading="lazy"><img src="${DEMO_BASE}${ex.demo}/1.jpg" alt="End position" loading="lazy"></div>
          ${dm ? (dm.err ? `<div class="muted">Couldn't load instructions.</div>` : `<ol class="steps">${dm.steps.map(x=>`<li>${x}</li>`).join("")}</ol>`) : `<div class="muted">Loading…</div>`}
          <div class="credit">Images and cues: free-exercise-db (public domain)</div></div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }
  if (day.core) h += `<label class="corecheck"><input type="checkbox" id="core" ${(saved?.core||coreDone)?"checked":""}> Core done<span class="muted">${day.core}</span></label>`;
  h += `<div class="note plain" style="margin:12px 2px 0"><b>Cardio:</b> ${cardioFor(key)}</div>`;
  h += `</div>`;

  const any = Object.keys(draft).filter(k=>k!=="__tank").some(k=>draft[k].some(s=>s&&s.r)) || (coreDone && !saved?.core);
  if (active) h += `<div class="savebar"><button class="primary" id="finish">Finish workout</button></div>`;
  else if (saved || any) h += `<div class="savebar"><button class="primary" id="save" ${any?"":"disabled"}>${saved?"Update session":"Save session"}</button></div>`;
  else h += `<div class="savebar"><button class="primary" id="start">Start workout</button></div>`;
  return h;
}

// ── Body ───────────────────────────────────────────────────────────────

function renderBody(){
  const isMap = sub==="map";
  const levels = isMap ? muscleStats() : recoveryStats();
  let h = `<div class="pad"><h2>${isMap?"Where you stand":"What's recovered"}</h2>
    <p class="lede">${isMap?"Built from the last 28 days of top sets and weekly set counts."+(prog().priority?.length?" Priority muscles need 10+ sets a week.":"")+" Tap a muscle.":"Big muscles get ~72 h, small ones ~48 h. Green is ready to hit again."}</p>
    <div class="seg"><button class="${isMap?"on":""}" data-sub="map">Strength map</button><button class="${!isMap?"on":""}" data-sub="recovery">Recovery</button></div>
    ${!isMap ? (()=>{ const dates=Object.keys(DB.sessions).sort(); const last=dates.length?daysBetween(dates[dates.length-1], iso(new Date())):null; const fresh=Object.values(levels).filter(l=>l.level===3||l.level===0).length;
      return `<div class="statrow"><div class="stat"><div class="v">${last===null?"—":last}</div><div class="k">Days since your last workout</div></div><div class="stat"><div class="v up">${fresh}</div><div class="k">Fresh muscle groups</div></div></div>`; })() : ""}
    <div class="bodywrap"><div>${bodySVG(true,levels)}<div class="lab">Front</div></div><div>${bodySVG(false,levels)}<div class="lab">Back</div></div></div>
    <div class="legend">${isMap
      ? `<span><i style="background:var(--ok)"></i>Strong</span><span><i style="background:var(--warn)"></i>Building</span><span><i style="background:var(--bad)"></i>Needs work</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>No data</span>`
      : `<span><i style="background:var(--ok)"></i>Ready</span><span><i style="background:var(--warn)"></i>Almost</span><span><i style="background:var(--bad)"></i>Recovering</span>`}</div>`;
  const pri = prog().priority || [];
  const order = Object.keys(MUSCLES).sort((a,b)=>(pri.includes(b)-pri.includes(a)) || ((levels[a].level||99)-(levels[b].level||99)));
  const rows = selMuscle ? [selMuscle] : order;
  h += `<div>` + rows.map(m=>{ const l=levels[m];
    const sub2 = isMap
      ? (l.level===0 ? "Log a session that hits it" : `${Math.round(l.sets7)} sets this week${l.trend!==null?` · ${l.trend>=0?"+":""}${l.trend.toFixed(1)}% est. 1RM (28 d)`:""}`)
      : (l.days===null ? "" : l.days===0 ? "Trained today" : `${l.days} day${l.days===1?"":"s"} since`);
    return `<div class="mrow" data-m="${m}"><div class="nm">${MUSCLES[m].n}${pri.includes(m)?' <span class="pritag">priority</span>':""}<div class="sub">${sub2}</div></div><div class="st l${l.level}">${l.label}</div></div>`; }).join("") + `</div>`;
  if (selMuscle) h += `<button class="ghost" style="width:100%;margin-top:12px" data-clearm>Show all muscles</button>`;
  return h + `</div>`;
}

// ── Progress ───────────────────────────────────────────────────────────
function renderProgress(){
  const tabs = [["lifts","Lifts"],["best","Best"],["history","Sessions"],["checkin","Check-in"]];
  let h = `<div class="pad"><h2>Progress</h2><p class="lede">Top sets, records, saved sessions, and bodyweight.</p>
    <div class="seg">${tabs.map(([k,l])=>`<button class="${sub===k?"on":""}" data-sub="${k}">${l}</button>`).join("")}</div>`;
  if (sub==="lifts") h += renderLifts();
  else if (sub==="best") h += renderBest();
  else if (sub==="history") h += renderHistory();
  else h += renderCheckin();
  return h + `</div>`;
}
function renderLifts(){
  const all = allEx(); const ex = all.find(a=>a.id===statPick)||all[0];
  let h = `<select id="pick">${all.map(a=>`<option value="${a.id}" ${a.id===ex.id?"selected":""}>${a.n}</option>`).join("")}</select>`;
  const hist = historyFor(ex.id);
  if (!hist.length) return h + `<div class="empty">Nothing logged for this lift yet.</div>`;
  const pts = hist.map(x=>({date:x.date,w:x.sets[0].w,r:x.sets[0].r,e:e1rm(x.sets[0].w,x.sets[0].r)})).filter(p=>p.e);
  const first=pts[0], last=pts[pts.length-1], delta=pts.length>1?last.e-first.e:0, best=pts.reduce((a,b)=>b.e>a.e?b:a,pts[0]);
  h += `<div class="statrow"><div class="stat"><div class="v">${fmt(last.w)}<span style="font-size:17px">×${last.r}</span></div><div class="k">Latest top set</div></div>
    <div class="stat"><div class="v ${delta>0?"up":delta<0?"down":""}">${delta>0?"+":""}${Math.round(delta)}</div><div class="k">Est. 1RM change, lbs</div></div></div>`;
  { const pj=projectLift(ex.lib), lv=strengthLevel(ex.lib, pj.now);
    h += `<div class="statrow"><div class="stat"><div class="v">${Math.round(pj.now)}</div><div class="k">Est. max today</div></div>
      <div class="stat"><div class="v ${pj.in4&&pj.in4>pj.now+1?"up":""}">${pj.in4?Math.round(pj.in4):"—"}</div><div class="k">${pj.in4?`Projected in 4 wks · ${pj.perWeek>=0?"+":""}${pj.perWeek.toFixed(1)}/wk · ${pj.conf} confidence`:"Projection needs 2+ sessions"}</div></div></div>`;
    if (lv) h += `<div class="note plain" style="margin-bottom:12px"><b>${lv.lvl}</b> — ${lv.ratio.toFixed(2)}× bodyweight.${lv.next?` ${lv.next.name} starts at ${Math.round(lv.next.at)} (${lv.next.at/latestWeight()}× bodyweight).`:" Top band."}</div>`; }
  if (pts.length>1) { const W=100,H=100,lo=Math.min(...pts.map(p=>p.e)),hi=Math.max(...pts.map(p=>p.e)),rng=(hi-lo)||1;
    const xy=pts.map((p,i)=>[(i/(pts.length-1))*W, H-((p.e-lo)/rng)*(H-14)-7]);
    h += `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--accent-2)" stroke-width="1.4" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.join(",")).join(" ")}"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.6" vector-effect="non-scaling-stroke" fill="${pts[i].e===best.e?"var(--accent)":"var(--accent-2)"}"/>`).join("")}</svg>`; }
  h += `<div class="hist">` + hist.slice().reverse().map(x=>{ const top=x.sets[0], isPR=e1rm(top.w,top.r)===best.e;
    const rest=x.sets.slice(1).filter(s=>s.r).map(s=>`${fmt(s.w)}×${s.r}`).join(" · ");
    return `<div class="hrow" data-goto="${x.date}"><div class="d">${fmtDate(x.date)}</div><div class="s">${fmt(top.w)} × ${top.r}</div>${isPR?'<div class="pr">best</div>':""}<div class="rest">${rest}${x.tank?` · tank ${x.tank}`:""}</div></div>`; }).join("") + `</div>`;
  return h;
}
function renderBest(){
  const rows = allEx().map(ex=>({ex,b:bestFor(ex.id)})).filter(r=>r.b).sort((a,b)=>b.b.e-a.b.e);
  if (!rows.length) return `<div class="empty">No records yet. They show up here after your first logged session.</div>`;
  return `<div class="hist">` + rows.map(r=>`<div class="hrow" data-goto="${r.b.date}"><div class="nm" style="flex:1">${r.ex.n}<div class="sub muted">${fmtDate(r.b.date)} · est. 1RM ${Math.round(r.b.e)}</div></div><div class="s">${fmt(r.b.w)} × ${r.b.r}</div></div>`).join("") + `</div>`;
}
function renderHistory(){
  const dates = Object.keys(DB.sessions).sort().reverse();
  const st=streakInfo();
  const head = `<div class="statrow"><div class="stat"><div class="v">${dates.length}</div><div class="k">Workouts logged</div></div>
    <div class="stat"><div class="v ${st.goal&&st.thisWeek>=st.goal?"up":""}">${st.thisWeek}<span style="font-size:17px;color:var(--dim)">/${st.goal||"—"}</span></div><div class="k">This week</div></div>
    <div class="stat"><div class="v ${st.weeks?"up":""}">${st.weeks}</div><div class="k">Week streak</div></div></div>`;
  if (!dates.length) return head + `<div class="empty">No saved sessions yet.</div>`;
  return head + `<div class="hist">` + dates.map(d=>{ const s=DB.sessions[d], day=s.day.startsWith("od:") ? OD[s.day.slice(3)] : prog().days[s.day]; let sets=0,reps=0,vol=0;
    for (const id in (s.ex||{})) for (const x of s.ex[id]) if (x.r){ sets++; reps+=x.r; vol+=(x.w||0)*x.r; }
    return `<div class="hrow" data-goto="${d}"><div class="d">${fmtDate(d)}</div><div style="flex:1">${day?day.name:s.day}<div class="sub muted">${sets} sets · ${reps} reps${s.dur?" · "+mmss(s.dur):""}${s.core?" · core":""}</div></div><div class="s">${vol>=1000?(vol/1000).toFixed(1)+"k":vol}<span style="font-size:11px;color:var(--dim)"> lbs</span></div></div>`; }).join("") + `</div>`;
}
function renderCheckin(){
  const all = DB.weights.slice().sort((a,b)=>a.date<b.date?-1:1), goal=DB.settings.goalWeight;
  const ws = all.filter(x=>x.w), tape = all.filter(x=>x.waist||x.hips);
  let h = `<div class="setrow" style="padding:0 0 6px"><div class="field"><input inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off" id="wIn" placeholder="Weight"><span>lbs</span></div>
    <div class="field"><input inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off" id="waistIn" placeholder="Waist"><span>in</span></div><div class="field"><input inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off" id="hipIn" placeholder="Hips"><span>in</span></div></div>
    <button class="primary" id="wSave" style="margin-bottom:14px">Log check-in</button>
    <div class="muted" style="margin:-6px 0 14px">Tape is optional but tells you more than the scale. Waist at the navel, hips at the widest point, relaxed.</div>`;
  if (tape.length) { const t0=tape[0], t1=tape[tape.length-1];
    h += `<div class="statrow">${t1.waist?`<div class="stat"><div class="v">${fmt(t1.waist)}<span style="font-size:15px;color:var(--dim)">${t0!==t1&&t0.waist?" "+(t1.waist-t0.waist>0?"+":"")+fmt(t1.waist-t0.waist):""}</span></div><div class="k">Waist, in</div></div>`:""}${t1.hips?`<div class="stat"><div class="v">${fmt(t1.hips)}<span style="font-size:15px;color:var(--dim)">${t0!==t1&&t0.hips?" "+(t1.hips-t0.hips>0?"+":"")+fmt(t1.hips-t0.hips):""}</span></div><div class="k">Hips, in</div></div>`:""}</div>`; }
  if (!ws.length) return h + `<div class="empty">Weigh in first thing, after the bathroom, before food. Same conditions every time — the trend is what matters, not any single number.${goal?"":"<br><br>Set a goal weight in Settings to see pace."}</div>`;
  const last=ws[ws.length-1], first=ws[0];
  const wk = ws.filter(w=>daysBetween(w.date,last.date)<=6), avg=wk.reduce((a,b)=>a+b.w,0)/wk.length;
  const span=daysBetween(first.date,last.date), rate= span>=7 ? (last.w-first.w)/(span/7) : null;
  h += `<div class="statrow"><div class="stat"><div class="v">${fmt(last.w)}</div><div class="k">Latest · ${fmtDate(last.date)}</div></div>
    <div class="stat"><div class="v">${fmt(avg)}</div><div class="k">7-day average</div></div></div>
    <div class="statrow"><div class="stat"><div class="v ${rate!==null&&rate<0?"up":""}">${rate===null?"—":(rate>0?"+":"")+rate.toFixed(1)}</div><div class="k">lbs / week</div></div>
    <div class="stat"><div class="v">${goal?fmt(last.w-goal):"—"}</div><div class="k">${goal?"to goal ("+goal+")":"No goal set"}</div></div></div>`;
  if (rate!==null && goal && last.w>goal) {
    const pct = Math.abs(rate)/last.w*100;
    h += `<div class="note plain">${rate>=0 ? "Weight isn't moving down. Check the calorie target before changing training." : pct<0.4 ? "Slow loss. Fine if strength is climbing; if lifts are flat too, nudge calories down 100." : pct<=1 ? "Right in the window — 0.5 to 1% a week keeps the muscle." : "Faster than 1% a week. That's where muscle starts going with the fat. Add 100–150 calories."}</div>`;
  }
  if (ws.length>1){ const W=100,H=100,vals=ws.map(w=>w.w),lo=Math.min(...vals,goal||Infinity),hi=Math.max(...vals),rng=(hi-lo)||1;
    const xy=ws.map((p,i)=>[(i/(ws.length-1))*W, H-((p.w-lo)/rng)*(H-14)-7]);
    const gy = goal ? H-((goal-lo)/rng)*(H-14)-7 : null;
    h += `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${gy!==null?`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--accent)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`:""}<polyline fill="none" stroke="var(--accent-2)" stroke-width="1.4" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.join(",")).join(" ")}"/></svg>`; }
  h += `<div class="hist">` + all.slice().reverse().slice(0,14).map(w=>`<div class="hrow"><div class="d">${fmtDate(w.date)}</div><div class="s">${w.w?fmt(w.w):"—"}</div><div class="rest">${[w.waist?"W "+fmt(w.waist):"",w.hips?"H "+fmt(w.hips):""].filter(Boolean).join(" · ")}</div></div>`).join("") + `</div>`;
  return h;
}

// ── Start / complete sheets ────────────────────────────────────────────
function renderStart(){
  const P=PROGRAMS[startSheet], b=DB.block, bi=blockInfo();
  const m=mondayOf(new Date()), nxt=new Date(m); nxt.setDate(m.getDate()+7);
  const n=(()=>{ let c=0; for (let d=0;d<P.weeks*7;d++){ const dt=new Date(m); dt.setDate(m.getDate()+d); const k=P.schedule(dt); if (P.days[k]&&!P.days[k].rest&&!P.days[k].optional) c++; } return c; })();
  return `<div class="modal" data-closestart><div class="sheet" onclick="event.stopPropagation()">
    <div class="muted">${P.level} · ${P.daysPerWeek} days a week · ${P.weeks} weeks</div>
    <h2>${P.name}</h2>
    <p class="lede" style="margin-top:8px">${P.why}</p>
    <div class="note plain">${n} sessions${P.deload?` · week ${P.weeks} is a deload`:""}${b&&bi&&!bi.complete?`<br><b style="color:var(--accent-2)">This replaces your current ${PROGRAMS[b.program].name} block (${bi.done}/${bi.req} done).</b>`:""}</div>
    <div class="bkrow" style="margin-top:14px"><button class="primary" data-start="this">Start this week<br><small style="font-weight:400;opacity:.8">from Mon ${MON[m.getMonth()]} ${m.getDate()}</small></button><button class="ghost" data-start="next">Next Monday<br><small style="opacity:.7">${MON[nxt.getMonth()]} ${nxt.getDate()}</small></button></div>
    <button class="ghost" style="width:100%;margin-top:8px" data-closestart>Cancel</button></div></div>`;
}
function renderBlockDone(){
  const bi=blockInfo(), P=PROGRAMS[bi.b.program]; const lifts=[];
  const seen=new Set(); for (const k in P.days) for (const sx of P.days[k].ex){ const ex=libEx(DB.swaps[sx.id]||sx.lib); if (seen.has(ex.lib)) continue; seen.add(ex.lib); const h=historyFor(ex.lib).filter(x=>x.date>=bi.b.start); if (h.length>=2){ const a=e1rm(h[0].sets[0].w,h[0].sets[0].r), z=e1rm(h[h.length-1].sets[0].w,h[h.length-1].sets[0].r); if (a&&z) lifts.push({n:ex.n,pct:(z-a)/a*100,from:h[0].sets[0],to:h[h.length-1].sets[0]}); } }
  lifts.sort((a,b)=>b.pct-a.pct);
  return `<div class="modal"><div class="sheet" onclick="event.stopPropagation()">
    <div class="prbanner">Block complete — ${bi.done} of ${bi.req} sessions</div>
    <h2 style="margin-top:10px">${P.name}, ${bi.b.weeks} weeks</h2>
    ${lifts.length?`<h3 style="margin:14px 0 6px">Where you moved</h3>`+lifts.slice(0,6).map(l=>`<div class="rvrow"><div class="nm">${l.n}</div><div class="nx">${fmt(l.from.w)}×${l.from.r} <span class="arrow">→</span> ${fmt(l.to.w)}×${l.to.r}</div><div class="${l.pct>0?"pr":"muted"}" style="width:52px;text-align:right;font-size:12px">${l.pct>0?"+":""}${l.pct.toFixed(0)}%</div></div>`).join(""):`<div class="empty">Not enough logged lifts to compare.</div>`}
    <p class="lede" style="margin-top:14px">Targets carry forward. Running it again starts week one at the numbers you finished on.</p>
    <div class="bkrow"><button class="primary" data-again>Run it again</button><button class="ghost" data-another>Pick another</button></div></div></div>`;
}

// ── On-demand picker ───────────────────────────────────────────────────
function renderOnDemand(){
  const g = odGroup;
  const list = Object.entries(OD).filter(([k,o])=>!g || o.g===g);
  return `<div class="modal" data-odclose><div class="sheet" onclick="event.stopPropagation()">
    <div class="ck" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)">On demand</div>
    <h2>${g ? OD_GROUPS.find(x=>x[0]===g)[1] : "Pick a muscle group"}</h2>
    <p class="lede" style="margin-top:6px">One-off sessions outside your block. They log and progress like anything else.</p>
    <div class="odgroups">${OD_GROUPS.map(([k,l])=>`<button class="${g===k?"on":""}" data-odgroup="${k}">${l}</button>`).join("")}</div>
    ${g ? list.map(([k,o])=>`<button class="odcard" data-od="${k}">
      <div class="odimgs">${o.ex.slice(0,3).map(x=>`<img src="${DEMO_BASE}${LIB[x.lib].demo}/1.jpg" alt="" loading="lazy">`).join("")}</div>
      <div><b>${o.name}</b><span>${o.tag}</span><span class="muted">${o.ex.length} exercises · ${o.ex.reduce((a,x)=>a+x.sets,0)} sets</span></div></button>`).join("") : ""}
    <button class="ghost" style="width:100%;margin-top:8px" data-odclose>Cancel</button></div></div>`;
}

// ── Settings ───────────────────────────────────────────────────────────
function renderSettings(){
  const s=DB.settings;
  const sw = t => ({venice:["#000000","#E8B923","#E03131"],iron:["#16191D","#D9A441","#ECEEF1"],paper:["#F5F6F8","#B8761A","#15191E"],midnight:["#0D1424","#4FC3F7","#E6ECF7"]})[t];
  return `<div class="pad"><h2>Settings</h2><p class="lede">Theme, program, goal, and backups.</p>
    <div class="themes">${[["venice","Venice"],["iron","Iron"],["paper","Paper"],["midnight","Midnight"]].map(([k,l])=>{ const c=sw(k);
      return `<div class="th ${s.theme===k?"on":""}" data-picktheme="${k}"><div class="sw" style="background:${c[0]}"><i style="background:${c[1]}"></i><i style="background:${c[2]};margin-left:3px;width:10px"></i></div>${l}</div>`; }).join("")}</div>
    <div class="row" style="margin-top:14px"><div class="k">Name<small>Shown in the header</small></div><input class="num" style="width:150px;text-align:left;font-family:var(--body);font-size:15px;font-weight:500" id="nameIn" value="${s.name||""}" placeholder="—"></div>
    <div class="row"><div class="k">Program<small>${DB.block?PROGRAMS[DB.block.program].name+" · "+fmtDate(DB.block.start)+" – "+fmtDate(DB.block.end):"No block running"}</small></div><button class="ghost" id="chgprog">Change</button></div>
    <div class="row"><div class="k">Strength standards<small>Bodyweight-ratio bands differ by sex. Used only for the level labels.</small></div>
      <select id="sexIn" style="width:auto;margin:0;padding:9px 34px 9px 12px"><option value="" ${!s.sex?"selected":""}>Off</option><option value="m" ${s.sex==="m"?"selected":""}>Men</option><option value="f" ${s.sex==="f"?"selected":""}>Women</option></select></div>
    <div class="row"><div class="k">Goal weight<small>Drives the pace check on the Check-in tab</small></div><input class="num" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" id="goalIn" value="${s.goalWeight??""}" placeholder="—"></div>
    <div class="row" style="flex-direction:column;align-items:stretch"><div class="k">Backup<small>Your log lives on this phone only. Save a copy every few weeks.</small></div>
      <div class="bkrow"><button class="ghost" id="exp">Save backup file</button><button class="ghost" id="imp">Restore backup</button></div><input type="file" id="impfile" accept="application/json" hidden></div>
    <div class="row" style="flex-direction:column;align-items:stretch"><div class="k">Reset<small>Wipes every session, target, and weigh-in on this device.</small></div><div class="bkrow"><button class="ghost danger" id="reset">Erase everything</button></div></div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
function bind(){
  const bg=$("#burger"); if (bg) bg.onclick=()=>{ menuOpen=!menuOpen; render(); };
  $$("[data-menuclose]").forEach(b=>b.onclick=()=>{ menuOpen=false; render(); });
  $$("[data-tab]").forEach(b=>b.onclick=()=>{ menuOpen=false; view=b.dataset.tab; sub = view==="body"?"map": view==="progress"?"lifts":sub; selMuscle=null; render(); });
  $$("[data-go]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); view=b.dataset.go; if (b.dataset.sub) sub=b.dataset.sub; else sub = view==="body"?"map": view==="progress"?"lifts":sub;
    if (view==="train") { cursor=new Date(); openEx=null; draft={}; coreDone=false; if (b.hasAttribute("data-pick")) pickOpen=true; } selMuscle=null; render(); });
  $$("[data-sub]:not([data-go])").forEach(b=>b.onclick=()=>{ sub=b.dataset.sub; selMuscle=null; render(); });
  $$("[data-goto]").forEach(b=>b.onclick=()=>{ cursor=parse(b.dataset.goto); view="train"; openEx=null; draft={}; coreDone=false; render(); });
  $$("[data-open]").forEach(b=>b.onclick=()=>{ const id=b.dataset.open;
    if (openEx!==id){ const ds=iso(cursor), sv=DB.sessions[ds], slot=slotFor(ds), day=dayOf(slot), se=day?.ex?.find(x=>x.id===id); const lib=se?resolveEx(se,ds).lib:id;
      if (sv?.ex?.[lib] && !draft[id]) draft[id]=sv.ex[lib].map(s=>({...s})); if (sv?.tank?.[lib]!==undefined){ draft.__tank ||= {}; draft.__tank[id] ??= sv.tank[lib]; } }
    swapOpen=null;
    openEx = openEx===id?null:id; render(); });
  $$("[data-m]").forEach(b=>b.onclick=()=>{ selMuscle = selMuscle===b.dataset.m?null:b.dataset.m; render(); });
  const cm=$("[data-clearm]"); if (cm) cm.onclick=()=>{ selMuscle=null; render(); };
  $$("[data-close]").forEach(b=>b.onclick=()=>{ review=null; render(); });
  $$("[data-picktheme]").forEach(b=>b.onclick=()=>{ DB.settings.theme=b.dataset.picktheme; DB.settings.themeSet=true; document.documentElement.dataset.theme=DB.settings.theme; persist(); render(); });

  const pb=$("#pickbtn"); if (pb) pb.onclick=(e)=>{ e.stopPropagation(); pickOpen=!pickOpen; render(); };
  $$("[data-prog]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); startSheet=b.dataset.prog; pickOpen=false; render(); });
  const op=$("#openpick"); if (op) op.onclick=(e)=>{ e.stopPropagation(); pickOpen=true; render(); };
  $$("[data-makeup]").forEach(b=>b.onclick=()=>{ DB.block.makeups[b.dataset.makeup]=iso(cursor); persist(); render(); });
  $$("[data-unmakeup]").forEach(b=>b.onclick=()=>{ delete DB.block.makeups[b.dataset.unmakeup]; persist(); render(); });
  $$("[data-start]").forEach(b=>b.onclick=()=>{ const when=b.dataset.start, P=startSheet; let m=mondayOf(new Date()); if (when==="next") m.setDate(m.getDate()+7);
    startBlock(P, m); startSheet=null; cursor=new Date(m); if (when!=="next" && iso(new Date())>=iso(m)) cursor=new Date(); toast(PROGRAMS[P].name+" started"); });
  $$("[data-closestart]").forEach(b=>b.onclick=()=>{ startSheet=null; render(); });
  $$("[data-again]").forEach(b=>b.onclick=()=>{ const m=mondayOf(new Date()); if (iso(new Date())>iso(m)) m.setDate(m.getDate()+7); startBlock(DB.block.program, m); blockDone=false; cursor=new Date(m); render(); });
  $$("[data-another]").forEach(b=>b.onclick=()=>{ blockDone=false; pickOpen=true; render(); });
  const cp=$("#chgprog"); if (cp) cp.onclick=(e)=>{ e.stopPropagation(); view="train"; pickOpen=true; render(); };
  if (pickOpen) document.body.onclick=()=>{ pickOpen=false; document.body.onclick=null; render(); }; else document.body.onclick=null;
  const pick=$("#pick"); if (pick) pick.onchange=()=>{ statPick=pick.value; render(); };
  const nm=$("#nameIn"); if (nm) nm.onchange=()=>{ DB.settings.name=nm.value.trim(); persist(); toast("Saved"); };
  const sx=$("#sexIn"); if (sx) sx.onchange=()=>{ DB.settings.sex=sx.value||null; persist(); toast("Saved"); };
  const goal=$("#goalIn"); if (goal) goal.onchange=()=>{ DB.settings.goalWeight = goal.value===""?null:Number(goal.value); persist(); toast("Goal saved"); };
  const core=$("#core"); if (core) core.onchange=()=>{ coreDone=core.checked; const btn=$("#save"); if (btn) btn.disabled=false; };

  $$("input[data-ex]").forEach(inp=>inp.oninput=()=>{ const {ex,i,f}=inp.dataset; draft[ex] ||= []; draft[ex][i] ||= {};
    const v = inp.value===""?null:Number(inp.value.replace(",",".")); draft[ex][i][f]=Number.isNaN(v)?null:v;
    const btn=$("#save"); if (btn) btn.disabled=false; });
  $$("input[data-tank]").forEach(inp=>{ inp.oninput=()=>{ draft.__tank ||= {}; draft.__tank[inp.dataset.tank]=Number(inp.value);
    const wrap=inp.closest(".tank"); wrap.querySelector(".lbl b").textContent=inp.value; wrap.querySelector(".read").textContent=tankLabel(Number(inp.value));
    const btn=$("#save"); if (btn) btn.disabled=false; }; });

  const ob=$("#obGo"); if (ob) ob.onclick=()=>{ const nm=$("#obName").value.trim(); DB.settings.name=nm||"Lifter"; DB.settings.onboarded=true;
    const pr=document.querySelector('input[name="obProg"]:checked'); if (pr) DB.settings.program=pr.value;
    if (!DB.block) startBlock(DB.settings.program, mondayOf(new Date()), false);
    if ($("#obSeed").checked) { DB.settings.seed="myles"; DB.targets=Object.assign({}, SEEDS.myles.targets, DB.targets); } persist(); render(); };
  const save=$("#save"); if (save) save.onclick=saveSession;
  const st=$("#start"); if (st) st.onclick=()=>{ DB.active={ date:iso(cursor), start:Date.now() }; persist(); render(); startClock(); };
  const fin=$("#finish"); if (fin) fin.onclick=()=>{ const has=Object.keys(draft).filter(k=>k!=="__tank").some(k=>draft[k].some(x=>x&&x.r)) || DB.sessions[iso(cursor)];
    if (!has && !confirm("Nothing logged yet. Finish anyway?")) return; saveSession(); };
  const dc=$("#discard"); if (dc) dc.onclick=()=>{ if (confirm("Discard the timer? Your entered sets stay.")) { DB.active=null; persist(); if (clockTimer){ clearInterval(clockTimer); clockTimer=null; } render(); } };
  $$("[data-week]").forEach(b=>b.onclick=()=>{ cursor.setDate(cursor.getDate()+7*Number(b.dataset.week)); openEx=null; draft={}; coreDone=false; render(); });
  $$("[data-demo]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.demo, ds=iso(cursor), slot=slotFor(ds), day=dayOf(slot), ex=resolveEx(day.ex.find(x=>x.id===id), ds); demoOpen[id]=!demoOpen[id]; render(); if (demoOpen[id] && !DEMO_CACHE[ex.demo]) { await loadDemo(ex.demo); render(); } });
  $$("[data-odpick]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); odOpen=true; odGroup=null; render(); });
  $$("[data-odclose]").forEach(b=>b.onclick=()=>{ odOpen=false; render(); });
  $$("[data-odgroup]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); odGroup=b.dataset.odgroup; render(); });
  $$("[data-od]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); if (view!=="train") cursor=new Date();
    const d=iso(cursor); if (DB.sessions[d] && !DB.sessions[d].day.startsWith("od:") && !confirm("There's already a logged session on this day. Add the on-demand workout anyway?")) return;
    DB.onDemand[d]=b.dataset.od; odOpen=false; view="train"; openEx=null; draft={}; persist(); render(); });
  $$("[data-unod]").forEach(b=>b.onclick=()=>{ delete DB.onDemand[iso(cursor)]; persist(); render(); });
  $$("[data-swap]").forEach(b=>b.onclick=()=>{ swapOpen = swapOpen===b.dataset.swap ? null : b.dataset.swap; render(); });
  $$("[data-swapclose]").forEach(b=>b.onclick=()=>{ swapOpen=null; render(); });
  const sk=$("#swapkeep"); if (sk) sk.onchange=()=>{ swapKeep=sk.checked; };
  $$("[data-swapto]").forEach(b=>b.onclick=()=>{ const ds=iso(cursor), slot=slotFor(ds), day=dayOf(slot), slotEx=day.ex.find(x=>x.id===swapOpen), to=b.dataset.swapto;
    if (to===slotEx.lib) { delete DB.swaps[slotEx.id]; if (DB.sessionSwaps[ds]) delete DB.sessionSwaps[ds][slotEx.id]; }
    else if (swapKeep) { DB.swaps[slotEx.id]=to; if (DB.sessionSwaps[ds]) delete DB.sessionSwaps[ds][slotEx.id]; }
    else { DB.sessionSwaps[ds] ||= {}; DB.sessionSwaps[ds][slotEx.id]=to; }
    delete draft[slotEx.id]; if (draft.__tank) delete draft.__tank[slotEx.id]; swapOpen=null; persist(); render(); });
  if (DB.active) startClock();
  const wS=$("#wSave"); if (wS) wS.onclick=()=>{ const v=Number($("#wIn").value)||null, wa=Number($("#waistIn").value)||null, hp=Number($("#hipIn").value)||null; if(!v&&!wa&&!hp) return; const d=iso(new Date());
    const prev=DB.weights.find(w=>w.date===d)||{}; DB.weights = DB.weights.filter(w=>w.date!==d); DB.weights.push({date:d, w:v??prev.w??null, waist:wa??prev.waist??null, hips:hp??prev.hips??null}); persist(); toast("Logged"); };
  const exp=$("#exp"); if (exp) exp.onclick=exportData;
  const imp=$("#imp"), impf=$("#impfile"); if (imp) imp.onclick=()=>impf.click(); if (impf) impf.onchange=()=>{ if(impf.files[0]) importData(impf.files[0]); };
  const rs=$("#reset"); if (rs) rs.onclick=()=>{ if (confirm("Erase every session, target and weigh-in on this device?")) { localStorage.removeItem(KEY); localStorage.removeItem("training-log-v1"); DB={ sessions:{}, targets:{}, weights:[], active:null, block:null, swaps:{}, sessionSwaps:{}, onDemand:{}, settings:{ theme:DB.settings.theme, themeSet:DB.settings.themeSet, program:"arnold", goalWeight:null, name:"", seed:null, onboarded:false } }; persist(); render(); } };
}

function saveSession(){
  const ds=iso(cursor), slot=slotFor(ds), key=slot.key, day=dayOf(slot);
  const rec = DB.sessions[ds] || { day:key, ex:{}, tank:{} };
  rec.tank ||= {};
  const rows=[], prs=[]; let sets=0,reps=0,vol=0;
  for (const slotEx of day.ex){
    const ex=resolveEx(slotEx, ds);
    const d=draft[ex.id] || rec.ex[ex.lib]; if (!d || !d.some(s=>s&&s.r)) continue;
    const clean=[]; for (let i=0;i<ex.sets;i++){ const s=d[i]||{}; clean.push({w:s.w??null,r:s.r??null}); }
    rec.ex[ex.lib]=clean;
    const tank = draft.__tank?.[ex.id] ?? rec.tank[ex.lib] ?? null; if (tank) rec.tank[ex.lib]=tank;
    for (const s of clean) if (s.r){ sets++; reps+=s.r; vol+=(s.w||0)*s.r; }
    const top=clean[0]; if (!top.r) continue;
    const before=target(ex), best=bestFor(ex.lib, ds), e=e1rm(top.w,top.r);
    const pr = !!(e && (!best || e>best.e) && best);   // needs a prior to count as "new"
    if (pr) prs.push({n:ex.n});
    const nx = slot.deload ? { t:before, moved:false, why:"Deload — holds" } : nextTarget(ex, before, top, tank);
    DB.targets[ex.tkey]=nx.t;
    rows.push({ n:ex.n, from:before, to:nx.t, why:nx.why, pr });
  }
  rec.core = !!(coreDone || rec.core);
  if (DB.active && DB.active.date===ds) { rec.dur = Date.now()-DB.active.start; DB.active=null; if (clockTimer){ clearInterval(clockTimer); clockTimer=null; } }
  if (slot.sess) { DB.block.done[slot.sess.i]=ds; rec.block=slot.sess.i; }
  DB.sessions[ds]=rec; persist();
  draft={}; openEx=null; coreDone=false;
  review={ date:ds, dayName:day.name, sets, reps, vol, rows, prs, dur:rec.dur, cardio:cardioFor(key) };
  const bi=blockInfo(); if (bi && bi.complete) blockDone=true;
  render();
}

function exportData(){ const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${APP_NAME.toLowerCase()}-${iso(new Date())}.json`; a.click(); URL.revokeObjectURL(a.href); }
function importData(file){ const fr=new FileReader(); fr.onload=()=>{ try { const n=JSON.parse(fr.result); if(!n.sessions) throw 0; DB={ sessions:n.sessions, targets:n.targets||{}, weights:n.weights||[], active:null, block:n.block||null, swaps:n.swaps||{}, sessionSwaps:n.sessionSwaps||{}, onDemand:n.onDemand||{}, settings:Object.assign(DB.settings,n.settings||{}) }; load(); persist(); document.documentElement.dataset.theme=DB.settings.theme; toast("Backup restored"); } catch(e){ toast("That file isn't a "+APP_NAME+" backup."); } }; fr.readAsText(file); }

load(); render();
(function(){
  const start=Date.now(), MIN=1500, el=document.getElementById("splash");
  const done=()=>{ if (!el) return; const wait=Math.max(0, MIN-(Date.now()-start)); setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),500); }, wait); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(done); else done();
})();
</script>
